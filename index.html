<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plato — Calorie Tracker</title>
<meta name="description" content="Snap your food, track calories, reach your goal.">
<meta name="theme-color" content="#130C05">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plato">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Golden orbit: Plato's single dark theme, taken from the amber-to-black Pluto artwork */
  --bg:#130C05; --glow:#77501E; --surface:#21160A; --surface2:#31220F; --ink:#FFF6E8; --muted:#C9AE87; --line:#3B2A15;
  --primary:#F2C37A; --pink:#E8946A; --orange:#F2A64B; --lime:#9BD07A; --sky:#7CC7E8; --red:#FF7A5C; --rust:#9C3E1E; --charon:#B8B2AA;
  --protein:#7CC7E8; --carb:#F2C37A; --fat:#E8946A; --water:#7CC7E8;
  --grad:linear-gradient(135deg,#F7D79A 0%,#E2A04F 55%,#B8662A 100%);
  --grad-warm:linear-gradient(135deg,#F2A64B 0%,#C0622F 100%);
  --on-grad:#2A1A08;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-logo:"Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(130% 520px at 50% 0%,var(--glow),var(--bg) 78%) no-repeat,var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
img{max-width:100%}
a{color:var(--primary)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;gap:8px}
.brand{font-family:var(--font-logo);font-weight:300;font-size:1.45rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);line-height:1}
.brand-tag{font-family:var(--font-logo);font-weight:900;font-size:.58rem;letter-spacing:.24em;color:var(--primary);margin-top:5px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:1.1rem;color:var(--primary);font-weight:700}
.datenav button:disabled{opacity:.35}
.datenav span{font-weight:700;min-width:100px;text-align:center;font-size:.95rem}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px}
h3{font-size:1rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border-radius:20px;padding:16px}
.stack>*+*{margin-top:12px}

.streak{display:inline-flex;align-items:center;gap:4px;background:var(--grad-warm);color:var(--on-grad);font-weight:800;border-radius:999px;padding:4px 10px;font-size:.85rem}
.offline{background:var(--surface2);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:.85rem;margin-top:6px}

/* plate hero */
.hero{display:grid;justify-items:center;padding:4px 0 0;position:relative;text-align:center}
.stars{position:absolute;inset:-10px -16px auto;height:300px;width:calc(100% + 32px);pointer-events:none}
.orbit{position:relative;width:min(70vw,270px);aspect-ratio:1}
.orbit>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.planet{position:absolute;inset:15%}
.planet img{width:100%;height:100%;display:block;transition:filter .4s}
.planet .fx{position:absolute;inset:0;-webkit-mask:url(pluto-golden.png) center/100% 100% no-repeat;mask:url(pluto-golden.png) center/100% 100% no-repeat;transition:opacity .4s}
.planet .rust{background:var(--rust);mix-blend-mode:multiply}
.planet.lit img{filter:drop-shadow(0 0 18px rgba(255,226,170,.75))}
.plate-num{font-family:var(--font-logo);font-size:clamp(2.8rem,12vw,3.6rem);font-weight:300;letter-spacing:.01em;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.plate-lbl{font-size:.9rem;color:var(--muted);margin-top:4px;font-weight:600}
.plate-sub{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:.85rem}
.plate-sub b{display:block;font-size:1.1rem;color:var(--ink)}
.over .plate-num{color:var(--pink)}
.moons{display:flex;justify-content:space-between;margin-top:10px}
.moon{display:grid;justify-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted)}
.moon.got{color:var(--ink)}
.moon svg{width:28px;height:28px}
/* steps & activity */
.earned{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.82rem;font-weight:700;color:var(--lime);background:rgba(155,208,122,.12);border-radius:999px;padding:4px 12px}
.steps-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.steps-row .info{flex:1;min-width:0}
.steps-ring{width:54px;height:54px;flex:none}
.steps-num{font-family:var(--font-logo);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.gain{font-weight:800;color:var(--lime);white-space:nowrap}
.big-in{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:10px 14px;font-family:var(--font-logo);font-weight:300;font-size:2.2rem;font-variant-numeric:tabular-nums}
.big-in:focus{border-color:var(--primary);outline:none}
.est{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:5px;margin-top:12px}
.est .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem}
.est .line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.est .plus{color:var(--lime);font-size:1.02rem}
.est p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{border:2px solid var(--surface2);background:var(--surface);border-radius:14px;padding:8px 4px;font-size:.8rem;font-weight:600;display:grid;justify-items:center;gap:2px}
.acts button span{font-size:1.3rem}
.acts button[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface))}
.stepper{display:flex;align-items:center;gap:8px}
.stepper>button{width:40px;height:40px;border-radius:50%;border:0;background:var(--primary);color:var(--on-grad);font-weight:800;font-size:1.15rem;flex:none}
.stepper output{font-family:var(--font-logo);font-size:1.35rem;min-width:70px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.stepper .chips{margin:0 0 0 auto;padding:0;gap:5px}
.stepper .chip{padding:5px 10px}
.chips .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-grad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){.planet img,.planet .fx{transition:none}}
.cheer{text-align:center;font-weight:700;margin:4px 0 0;color:var(--primary)}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro{border-radius:16px;padding:10px 12px;background:var(--surface)}
.macro .name{font-size:.8rem;font-weight:700}
.macro .val{font-weight:800;font-size:1.05rem}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px}
.micros{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;border:0;font-weight:600}
.chip.warn{background:color-mix(in srgb,var(--red) 16%,var(--surface));color:var(--red)}

.water{display:flex;align-items:center;gap:10px;justify-content:space-between}
.glasses{display:flex;gap:5px;flex-wrap:wrap}
.glass{width:24px;height:30px;border:2.5px solid var(--water);border-radius:3px 3px 8px 8px;background:transparent;padding:0}
.glass.full{background:var(--water)}

.meal{margin-top:12px;border-left:5px solid var(--mc)}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal-head+.entry,.wlist .entry:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--surface2);flex:none;display:grid;place-items:center;font-size:1.3rem}
.entry .info{flex:1;min-width:0}
.entry .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .kc{font-weight:800;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:1.05rem;flex:none}
.iconbtn.ed{display:inline-grid;place-items:center;color:var(--primary)}
.iconbtn.ed svg{width:18px;height:18px}
.entry .info[data-edit]{cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.recents{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.recents .chip{white-space:nowrap;border:2px solid var(--surface2)}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;align-items:center;height:64px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);height:100%;justify-content:center;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary);font-weight:800}
.fab{justify-self:center;width:68px;height:68px;border-radius:50%;border:0;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;transform:translateY(-18px);box-shadow:0 8px 24px rgba(226,160,79,.35)}
.fab svg{width:30px;height:30px}
body.setup nav.tabs,body.playing nav.tabs{display:none}
body.playing{overflow:hidden}

.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:800;background:var(--grad);color:var(--on-grad);width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.inp{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px 12px}
.inp:focus{border-color:var(--primary);outline:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:.9rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-grad);font-weight:800}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:12px;color:var(--on-grad)}
.stat span{opacity:.9;font-size:.82rem;font-weight:600}
.stat b{display:block;font-size:1.4rem;letter-spacing:-.02em}
.s1{background:linear-gradient(135deg,#F7D79A,#E2A04F)}
.s2{background:linear-gradient(135deg,#F4B08C,#D9744A)}
.s3{background:linear-gradient(135deg,#F8C978,#E8913A)}
.s4{background:linear-gradient(135deg,#B5E2F4,#6FB6D8)}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:300px}
.wlist .entry{padding:8px 0}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:.9rem}
.note.warn{background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.note.good{background:color-mix(in srgb,var(--lime) 18%,var(--surface))}
.target-card{background:var(--grad);color:var(--on-grad)}
.target-card .muted{color:rgba(42,26,8,.72)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.method{font-size:.88rem;color:var(--muted)}
.method p{margin:6px 0}
.method b{color:var(--ink)}

/* setup */
.setup-hero{text-align:center;padding:30px 4px 10px}
.setup-hero .big{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:14px 0 8px}
.setup-hero img{width:96px;height:96px;border-radius:24px}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.steps-dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.steps-dots i.on{width:22px;background:var(--primary)}
ol.howto{padding-left:20px;margin:8px 0;font-size:.9rem}
ol.howto li{margin:4px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,5,2,.66);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.preview{width:100%;max-height:240px;object-fit:cover;border-radius:18px;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;padding:20px 8px;font-weight:800;cursor:pointer;text-align:center;color:#fff}
.pick label:first-child{background:var(--grad)}
.pick label:last-child{background:var(--grad-warm)}
.pick svg{width:30px;height:30px}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.item{background:var(--surface);border-radius:16px;padding:12px;margin-top:10px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input{flex:1;background:transparent;border:0;border-bottom:2px dashed var(--line);padding:4px 0;font-weight:700}
.item-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.portion{display:flex;align-items:center;gap:6px}
.portion button{width:32px;height:32px;border-radius:50%;border:0;background:var(--primary);color:var(--on-grad);font-weight:800}
.portion span{min-width:44px;text-align:center;font-weight:800}
.totals{display:flex;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px;margin-top:12px;font-size:.9rem}
.totals b{font-size:1.25rem}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid var(--surface2);border-top-color:var(--pink);border-right-color:var(--primary);animation:spin 1s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}.spinner{animation-duration:3s}}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.update-bar{border:1px solid var(--primary);position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:45;width:min(528px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 6px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(20,10,40,.28)}
.update-bar p{margin:0;flex:1;min-width:0;font-size:.9rem;font-weight:600;line-height:1.3}
.update-bar p small{display:block;font-weight:500;opacity:.8}
.update-bar .btn{flex:none}
.update-bar .iconbtn{color:var(--bg);opacity:.75}
.rel{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:10px}
.rel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* ============ workouts ============ */
.btn.light{background:#FFF6E8;color:#3A240C}
.iconbtn.light{color:var(--on-grad);background:rgba(42,26,8,.12)}
.w-hero{background:var(--grad);color:var(--on-grad);border-radius:24px;margin-top:8px;overflow:hidden;display:grid;grid-template-columns:1fr;position:relative}
.w-hero-stage{aspect-ratio:1/1;max-height:340px;width:100%;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.35),rgba(255,255,255,0) 65%)}
.w-hero-copy{padding:0 20px 20px}
.w-hero h1{font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.05;letter-spacing:-.035em;margin:0 0 8px;font-weight:800}
.w-hero p{margin:0 0 14px;opacity:.92}
.stage-still{width:100%;height:100%;object-fit:contain;display:block}
.w-hero-stage,.qw img{-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 99%);mask-image:linear-gradient(180deg,#000 72%,transparent 99%)}
.plan-card{background:var(--grad);color:var(--on-grad);border-radius:24px;padding:16px;margin-top:8px}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-top h3{font-size:1.3rem;letter-spacing:-.02em;margin:2px 0 0}
.plan-src{font-size:.78rem;font-weight:700;opacity:.85}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{background:rgba(42,26,8,.1);border-radius:14px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.wd span{font-size:.7rem;opacity:.9}
.wd b{font-size:1.05rem}
.wd.rest{opacity:.55}
.wd.done{background:rgba(42,26,8,.2)}
.wd.today{background:#2A1A08;color:#F7D79A;opacity:1}
.today-w{background:var(--surface);border-radius:24px;margin-top:12px;overflow:hidden}
.today-w.is-rest{padding:4px 0}
.today-stage{aspect-ratio:4/3;width:100%;max-height:300px;background:radial-gradient(circle at 50% 75%,var(--surface2),var(--surface) 70%)}
.today-w-copy{padding:14px 16px 16px}
.today-w-copy h3{font-size:1.5rem;letter-spacing:-.025em;margin:2px 0 4px}
.today-w-copy p{margin:0}
.plan-week{background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:12px}
.plan-week>summary,.wlist>summary,.wp-how>summary{cursor:pointer;font-weight:700;list-style-position:inside}
.pw-day{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:12px}
.pw-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pw-list{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px}
.pw-list.col{flex-direction:column;overflow:visible}
.pw-ex{display:flex;align-items:center;gap:10px;background:var(--surface2);border:0;border-radius:14px;padding:6px 12px 6px 6px;text-align:left;flex:none;min-width:0}
.pw-list.col .pw-ex{background:var(--surface)}
.pw-ex img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--surface)}
.pw-list.col .pw-ex img{background:var(--surface2)}
.pw-ex span{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;line-height:1.25}
.pw-ex small{font-weight:600;color:var(--muted)}
ul.tips{margin:6px 0 0;padding-left:18px}
ul.tips li{margin:4px 0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:6px 0 6px 38px;min-height:30px}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:4px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-grad);font-weight:800;font-size:.85rem;display:grid;place-items:center}

    <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
    <button class="fab" id="fab" aria-label="Log food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>

<div class="update-bar hidden" id="updBar" role="status"></div>

<script>
/* ============================================================
   CONFIG — the only part you need to edit
   ============================================================ */
const CONFIG = {
  // Your Cloudflare Worker address (no slash at the end), e.g. "https://plato-api.yourname.workers.dev"
  WORKER_URL: "https://plato-api.wesley-mambiar.workers.dev",
  // Donations: leave any of these as "" to hide them.
  GCASH_QR_IMAGE: "gcash-qr.png",   // upload your GCash QR next to index.html and write its file name, e.g. "gcash-qr.png"
  GCASH_NAME: "Wesley",       // name shown under the QR, e.g. "J. W. M."
  KOFI_URL: "",         // e.g. "https://ko-fi.com/yourname" (or a Buy Me a Coffee link)
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(Number(n)||0);
const r1 = n => Math.round((Number(n)||0)*10)/10;
function dstr(d=new Date()){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
function prettyDate(s){ const t=dstr(); if(s===t) return "Today"; if(s===addDays(t,-1)) return "Yesterday"; return new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }
function mealForNow(){ const h=new Date().getHours(); if(h<10) return "breakfast"; if(h<15) return "lunch"; if(h<17) return "snacks"; if(h<22) return "dinner"; return "snacks"; }
const MEALS = [["breakfast","Breakfast","var(--orange)"],["lunch","Lunch","var(--lime)"],["dinner","Dinner","var(--primary)"],["snacks","Snacks","var(--pink)"]];

/* ============ storage: this device only ============ */
// Everything lives in this browser's localStorage. Nothing is sent anywhere except
// food photos/descriptions to the AI (through your Worker) when you ask for an analysis.
const Store = {
  get(k,def){ try{ const v=localStorage.getItem("plato:"+k); return v? JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem("plato:"+k, JSON.stringify(v)); }catch(e){ toast("Storage is full — export a backup and clear old photos"); } },
  keys(){ return Object.keys(localStorage).filter(k=>k.startsWith("plato:")); }
};

/* ============ state ============ */
const S = {
  tab:"today", date:dstr(),
  profile:Store.get("profile",null), weights:Store.get("weights",[]), summary:Store.get("summary",{}), recents:Store.get("recents",[]),
  settings:Store.get("settings",{setupDone:false}), scans:Store.get("scans",null),
  day:null, setupStep:0, installEvt:null
};
function loadDay(){ S.day = Store.get("day-"+S.date,{entries:[],water:0}); if(!S.day.entries) S.day.entries=[]; }
function saveDay(){
  Store.set("day-"+S.date,S.day);
  const t=dayTotals(S.day);
  if(S.day.entries.length||S.day.steps||S.day.acts?.length) S.summary[S.date]={kcal:r0(t.kcal),p:r0(t.p),c:r0(t.c),f:r0(t.f),steps:S.day.steps||0,earned:dayEarned(S.day).earned}; else delete S.summary[S.date];
  Store.set("summary",S.summary);
  clearTimeout(saveDay._m); saveDay._m=setTimeout(checkMoons,2600);
}
/* ============ steps & activity ============ */
// Plans already include a usual day's movement (via the activity level), so only steps above that
// usual amount count. Plato adds half of the estimated burn, capped per day, to protect the deficit.
const ACTS=[["walk","🚶","Walking",4.3],["jog","🏃","Jogging",7.0],["ball","🏀","Basketball",6.5],["bike","🚴","Cycling",6.8],["zumba","💃","Zumba",6.5],["swim","🏊","Swimming",6.0],["badminton","🏸","Badminton",5.5],["gym","🏋️","Gym",5.0],["chores","🧹","Chores",3.3]];
const INTENSITY={easy:[0.8,"Easy"],moderate:[1,"Moderate"],hard:[1.25,"Hard"]};
const EARN_SHARE=0.5, EARN_CAP=500, STEP_GOAL=10000;
function usualSteps(){ const a=+(S.profile?.activity||1.375); return a<1.3?5000:a<1.45?7500:a<1.6?10000:12500; }
function stepsBurn(steps){
  const kg=currentWeight(), cm=S.profile?.heightCm, extra=Math.max(0,(steps||0)-usualSteps());
  if(!kg||!cm) return {extra,km:0,burn:0};
  const km=extra*cm*(S.profile.sex==="male"?0.415:0.413)/100/1000; // step length ≈ 41% of height
  return {extra,km,burn:0.5*kg*km};                                 // walking ≈ 0.5 kcal per kg per km above resting
}
function actBurn(type,min,int){ const a=ACTS.find(x=>x[0]===type), kg=currentWeight(); if(!a||!kg) return 0; return Math.max(0,(a[3]*INTENSITY[int][0]-1)*kg*min/60); }
function dayEarned(day){
  const st=r0(stepsBurn(day.steps).burn*EARN_SHARE), ac=(day.acts||[]).reduce((t,x)=>t+r0((+x.kcal||0)*EARN_SHARE),0), raw=st+ac; // round each part so the parts add up to the total
  return {steps:st,acts:ac,earned:r0(Math.min(EARN_CAP,raw)),capped:raw>EARN_CAP};
}
function dayTotals(day){ const t={kcal:0,p:0,c:0,f:0,fiber:0,sugar:0,sodium:0}; for(const e of day.entries) for(const k in t) t[k]+=Number(e[k])||0; return t; }
function currentWeight(){ return S.weights.length? S.weights[S.weights.length-1].kg : (S.profile?.startKg||null); }
function saveSettings(){ Store.set("settings",S.settings); }
function deviceId(){ let id=Store.get("device",""); if(!id){ id=(crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid()).replace(/[^A-Za-z0-9-]/g,""); Store.set("device",id); } return id; }
function scansLeft(){ return S.scans&&S.scans.day===phDay()? S.scans.remaining : null; }
function phDay(){ return new Date(Date.now()+8*3600e3).toISOString().slice(0,10); }
const hasDonate=()=>!!(CONFIG.GCASH_QR_IMAGE||CONFIG.KOFI_URL);
function streak(){ let d=dstr(), n=0; if(!S.summary[d]) d=addDays(d,-1); while(S.summary[d]?.kcal>0){ n++; d=addDays(d,-1); } return n; }

/* ============ research-based plan ============ */
const ACTIVITY=[[1.2,"Sedentary","Desk job, little exercise"],[1.375,"Lightly active","Light exercise 1–3 days/week"],[1.55,"Moderately active","Exercise 3–5 days/week"],[1.725,"Very active","Hard exercise 6–7 days/week"]];
function calcPlan(){
  const p=S.profile, kg=currentWeight();
  if(!p||!kg||!p.heightCm||!p.age) return null;
  const m=p.heightCm/100;
  const bmr=10*kg+6.25*p.heightCm-5*p.age+(p.sex==="male"?5:-161);   // Mifflin–St Jeor
  const tdee=bmr*p.activity;
  const bmi=kg/(m*m), minHealthy=18.5*m*m, floor=p.sex==="male"?1500:1200;
  const goalOk=!p.goalKg||p.goalKg>=minHealthy-0.05;
  const losing=goalOk&&p.goalKg&&p.goalKg<kg-0.1;
  let pace=losing?Math.min(p.pace,kg*0.01):0;                          // max 1% body weight / week
  const capped=losing&&p.pace>kg*0.01;
  let deficit=pace*7700/7, target=tdee-deficit, floored=false;        // ~7,700 kcal per kg fat
  if(losing&&target<floor){ target=floor; floored=true; deficit=Math.max(0,tdee-floor); pace=deficit*7/7700; }
  target=Math.round(target/10)*10;
  const refKg=Math.min(kg,25*m*m);
  const proteinG=Math.round(1.6*refKg), fatG=Math.round(target*0.28/9);
  const carbG=Math.max(0,Math.round((target-proteinG*4-fatG*9)/4)), fiberG=Math.round(target/1000*14);
  const weeks=pace>0?(kg-p.goalKg)/pace:null, eta=weeks?addDays(dstr(),Math.round(weeks*7)):null;
  return {bmr,tdee,bmi,minHealthy,floor,goalOk,losing,pace,capped,deficit,target,floored,proteinG,fatG,carbG,fiberG,weeks,eta,kg};
}
function bmiLabel(b){ if(b<18.5) return "Underweight"; if(b<23) return "Healthy"; if(b<25) return "Overweight"; if(b<30) return "Obese I"; return "Obese II"; }

/* ============ AI (through your Cloudflare Worker) ============ */
async function fileToBase64Jpeg(file, max=1024){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej({code:"bad_image"}); i.src=URL.createObjectURL(file); });
  const sc=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas");
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL("image/jpeg",0.8).split(",")[1];
}
async function callWorker(payload, signal){
  let res;
  try{
    res=await fetch(CONFIG.WORKER_URL.replace(/\/$/,"")+"/analyze",{method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,deviceId:deviceId()})});
  }catch(e){ if(e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  let data={}; try{ data=await res.json(); }catch(e){}
  if(typeof data.remaining==="number"){ S.scans={day:phDay(),remaining:data.remaining,limit:data.limit}; Store.set("scans",S.scans); }
  if(!res.ok) throw {code:data.code||"busy"};
  return data;
}
function errText(e){
  return ({
    network:"No internet connection. Photo analysis needs internet — use quick add for now, or try again when you're online.",
    limit:`You've used today's ${S.scans?.limit||""} photo scans. They reset at midnight. Quick add and recent foods still work.`,
    capacity:"Plato has reached today's free AI limit for everyone. Scans come back tomorrow — quick add and recent foods still work.",
    credits:"Photo scans are paused for now while Plato tops up its AI credit. Logging still works.",
    busy:"The AI service is busy right now. Try again in a moment.",
    quota:"Plato's free AI scans are used up for now. Try again in a few minutes, or tomorrow if it keeps happening. Quick add still works.",
    json:"The result came back in an unreadable format. Try again, or describe the food in words.",
    bad_image:"That image couldn't be read. Try a JPG or PNG photo.",
    config:"Photo scanning isn't set up correctly yet. The app owner needs to check the Worker settings.",
    forbidden:"Photo scanning isn't set up correctly yet. The app owner needs to check ALLOWED_ORIGIN.",
    off:"Photo scanning isn't turned on yet. You can still log with quick add.",
  })[e?.code] || "Something went wrong while analyzing. Try again in a moment.";
}

/* ============ render shell ============ */
function render(){
  const setup=!S.settings.setupDone;
  document.body.classList.toggle("setup",setup);
  document.querySelectorAll(".tab").forEach(b=>{ if(b.dataset.tab===S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const app=$("#app");
  leaveWorkout();
  if(S.tab==="weight") S.tab="progress";
  app.innerHTML = setup? viewSetup() : S.tab==="today"? viewToday() : S.tab==="progress"? viewProgress() : S.tab==="workout"? viewWorkout() : viewMe();
  bindView();
  window.scrollTo(0,0);
}

/* ============ first-launch setup ============ */
function viewSetup(){
  return `
    <div class="setup-hero">
      <img src="pluto-golden.png" alt="">
      <div class="big">Snap it.<br>Track it.<br>Own it.</div>
      <p class="muted">Take a photo of your food and Plato estimates the calories and nutrients, then keeps you on a healthy pace to your goal.</p>
    </div>
    <div class="note good">🔒 Your log, weight and plan stay on this phone only — no account needed. Food photos are sent to Google's Gemini AI for analysis, and Plato doesn't store them.</div>
    <button class="btn" data-setup="done" style="margin-top:16px">Set up my plan</button>`;
}
/* ============ Today ============ */
// Pluto's five real moons are the streak rewards.
const MOONS=[["Charon",3],["Nix",7],["Hydra",14],["Kerberos",30],["Styx",60]];
const STARS=[[6,22],[14,70],[30,12],[48,58],[62,8],[78,40],[90,18],[95,64],[22,92],[84,88]];
// The photo stays a photo: a soft night-side shadow recedes as the day fills up, it glows on target,
// and a rust tint spreads when over. Both layers are masked by the PNG's own round shape.
function plutoOrbit(eaten,target){
  const p=target?eaten/target:1, over=target&&eaten>target, lit=target&&p>=0.85&&!over;

function lineChart(points,goal){
  if(!points.length) return `<div class="empty">Log your weight to see the trend.</div>`;
  const W=340,H=190,pl=36,pr=10,pt=12,pb=26, vals=points.map(p=>p.kg).concat(goal?[goal]:[]);

  const t0=new Date(points[0].date).getTime(), t1=Math.max(new Date(points[points.length-1].date).getTime(),t0+864e5*6);
  const x=d=>pl+(new Date(d).getTime()-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=points.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+","+y(p.kg).toFixed(1)).join("");
  const area=path+`L${x(points[points.length-1].date).toFixed(1)},${H-pb}L${x(points[0].date).toFixed(1)},${H-pb}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    <defs><linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#F2C37A"/><stop offset="1" stop-color="#E8946A"/></linearGradient>
    <linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C37A" stop-opacity=".25"/><stop offset="1" stop-color="#F2C37A" stop-opacity="0"/></linearGradient></defs>
    ${[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(v)}</text>`).join("")}
    ${points.length>1?`<path d="${area}" fill="url(#wa)"/>`:""}
    ${goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="2"/><text x="${W-pr}" y="${y(goal)-5}" font-size="10" text-anchor="end" fill="var(--orange)" font-weight="700">goal ${goal}</text>`:""}
    <path d="${path}" fill="none" stroke="url(#wl)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3.5" fill="var(--surface)" stroke="var(--pink)" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${prettyDate(points[0].date)}</text>
    <text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${prettyDate(points[points.length-1].date)}</text></svg>`;
}

function trendPerWeek(){

  ${plan?.eta?`<div class="note good" style="margin-top:12px">At ${r1(plan.pace)} kg/week, you'd reach ${S.profile.goalKg} kg around <b>${new Date(plan.eta+"T12:00:00").toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}</b> 🎉 Real progress isn't a straight line — 1–2 kg daily water swings are normal.</div>`:""}`;
}

/* ============ Weight (shown inside Progress) ============ */
function weightLogCard(){
  const today=S.weights.find(w=>w.date===dstr());
  const recent=[...S.weights].reverse();
  return `
  <div class="card stack">
    <label class="f" for="wIn">Today's weight (kg)</label>
    <div class="row"><input class="inp" id="wIn" type="number" inputmode="decimal" step="0.1" min="25" max="350" value="${today?today.kg:""}" placeholder="e.g. 72.4"><button class="btn" id="wSave" style="flex:0 0 110px">${today?"Update":"Save"}</button></div>
    <p class="muted small" style="margin:0">Weigh at the same time each day — ideally morning, before eating. Your target updates from your latest weight.</p>
    ${recent.length?`<details class="wlist"><summary class="muted small">Weigh-in history (${recent.length})</summary>${recent.map(w=>`<div class="entry"><div class="info"><div class="nm">${r1(w.kg)} kg</div><div class="muted small">${prettyDate(w.date)}</div></div><button class="iconbtn" data-wdel="${w.date}" aria-label="Delete ${prettyDate(w.date)} weight">✕</button></div>`).join("")}</details>`:""}
  </div>`;
}

/* ============ Me: plan + settings ============ */

    <div style="font-size:2.7rem;font-weight:800;letter-spacing:-.04em;line-height:1.1">${plan.target.toLocaleString()} <span style="font-size:1rem;font-weight:600">kcal</span></div>
    <div class="plan-grid" style="margin-top:12px">
      <div><div class="muted small">BMR</div><b>${r0(plan.bmr).toLocaleString()} kcal</b></div>
      <div><div class="muted small">Maintenance</div><b>${r0(plan.tdee).toLocaleString()} kcal</b></div>
      <div><div class="muted small">Daily deficit</div><b>${r0(plan.deficit).toLocaleString()} kcal</b></div>
      <div><div class="muted small">Expected loss</div><b>${r1(plan.pace)} kg/week</b></div>

      <div><div class="muted small">Macros</div><b>P ${plan.proteinG} · C ${plan.carbG} · F ${plan.fatG} g</b></div>
    </div></div>
    ${!plan.goalOk?`<div class="note warn" style="margin-top:12px">Your goal weight is below the healthy BMI range for your height. The lowest healthy weight is about ${r1(plan.minHealthy)} kg, so the plan stays at maintenance until the goal is raised.</div>`:""}
    ${plan.floored?`<div class="note warn" style="margin-top:12px">That pace would put you under ${plan.floor.toLocaleString()} kcal, the usual minimum without medical supervision. The target is held at ${plan.floor.toLocaleString()} kcal, so expect about ${r1(plan.pace)} kg/week.</div>`:""}
    ${plan.capped&&!plan.floored?`<div class="note" style="margin-top:12px">Pace capped at 1% of your body weight per week (${r1(plan.kg*0.01)} kg) to protect muscle and keep it sustainable.</div>`:""}`
  :`<div class="note" style="margin-top:8px">Fill this in once. Your target comes from your body, activity and goal — not a generic number.</div>`}

  <h2>Your plan</h2>

    <div class="row">
      <div><label class="f" for="pAge">Age</label><input class="inp" id="pAge" type="number" inputmode="numeric" min="18" max="100" value="${p.age}"></div>
      <div><label class="f" for="pH">Height (cm)</label><input class="inp" id="pH" type="number" inputmode="decimal" min="120" max="230" value="${p.heightCm}"></div>
    </div>
    <div class="row">
      <div><label class="f" for="pW">Current weight (kg)</label><input class="inp" id="pW" type="number" inputmode="decimal" step="0.1" value="${currentWeight()||""}"></div>
      <div><label class="f" for="pG">Goal weight (kg)</label><input class="inp" id="pG" type="number" inputmode="decimal" step="0.1" value="${p.goalKg}"></div>
    </div>
    <div><label class="f" for="pAct">Activity level</label><select class="inp" id="pAct">${ACTIVITY.map(([v,n,d])=>`<option value="${v}" ${+p.activity===v?"selected":""}>${n} — ${d}</option>`).join("")}</select></div>
    <div><label class="f">Weekly pace</label><div class="seg">${[[0.25,"0.25 kg"],[0.5,"0.5 kg"],[0.75,"0.75 kg"],[1,"1 kg"]].map(([v,l])=>`<button data-pace="${v}" aria-pressed="${+p.pace===v}">${l}</button>`).join("")}</div>
      <p class="muted small" style="margin:6px 0 0">0.5 kg/week is the most sustainable for most people.</p></div>
    <button class="btn" id="pSave">Save plan</button>
  </div>

  ${hasDonate()?`<h2 id="support">Support Plato ☕</h2>
  <div class="card stack" style="text-align:center">
    <p class="muted small" style="margin:0">Plato is free with no ads. Each photo scan costs a small amount of AI credit, so any amount helps keep it running for everyone. Salamat! 💜</p>
    ${CONFIG.GCASH_QR_IMAGE?`<div><img src="${esc(CONFIG.GCASH_QR_IMAGE)}" alt="GCash QR code for donations" style="width:220px;max-width:100%;border-radius:16px;background:#fff;padding:8px">
      <div style="font-weight:800;margin-top:4px">GCash${CONFIG.GCASH_NAME?` · ${esc(CONFIG.GCASH_NAME)}`:""}</div><div class="muted small">Screenshot this QR, then open GCash → Pay QR → Upload QR.</div></div>`:""}
    ${CONFIG.KOFI_URL?`<a class="btn" href="${esc(CONFIG.KOFI_URL)}" target="_blank" rel="noopener" style="display:block;text-decoration:none">Donate online ☕</a>`:""}
  </div>`:""}

  <h2>Photo scans</h2>
  <div class="card stack">
    <p class="muted small" style="margin:0">${!CONFIG.WORKER_URL?"Photo scanning isn't turned on yet.":scansLeft()!==null?`You have <b style="color:var(--ink)">${scansLeft()} of ${S.scans.limit}</b> photo scans left today. They reset at midnight.`:"You get a set number of free photo scans each day. They reset at midnight."}</p>
    <p class="muted small" style="margin:0"><b style="color:var(--ink)">Privacy:</b> when you scan, your photo and note are sent to Google's Gemini AI to estimate nutrition, under Google's Gemini API terms. Avoid including faces or personal info in food photos. When you build a workout plan, your answers (goal, schedule, experience, pain areas, age and sex) are sent the same way. Plato itself doesn't store your photos, and your logs never leave this phone.</p>
  </div>

  <h2>Updates</h2>
  <div class="card stack">
    <p class="muted small" style="margin:0" id="appVer">${versionText()}</p>
    <div class="row"><button class="btn ghost" id="chkUpd">Check for updates</button><button class="btn ghost" id="seeNew">What's new</button></div>
  </div>

  <h2>Install and backup</h2>
  <div class="card stack">
    ${standalone?`<div class="note good">✅ Plato is installed on this device.</div>`
      : S.installEvt?`<button class="btn" id="install">Install Plato on this device</button>`
      : `<div class="note">${isIOS?"To install: tap the Share button in Safari, then “Add to Home Screen”.":"To install: open your browser menu and choose “Install app” or “Add to Home screen”."}</div>`}
    <p class="muted small" style="margin:0">Your log lives only in this browser. Export a backup now and then — if you clear browser data or change phones, you can import it back.</p>
    <div class="row"><button class="btn ghost" id="exp">Export backup</button><label class="btn ghost" style="text-align:center;cursor:pointer">Import backup<input type="file" accept="application/json,.json" id="imp" class="hidden"></label></div>
    <button class="btn danger" id="wipe">Erase all my data on this device</button>
  </div>

  <h2>How it's calculated</h2>
  <div class="card method">
    <p><b>BMR</b> uses the Mifflin–St Jeor equation, the most accurate formula for adults in validation studies and the one recommended by the Academy of Nutrition and Dietetics.</p>
    <p><b>Maintenance (TDEE)</b> = BMR × an activity factor (1.2 to 1.725).</p>
    <p><b>Deficit</b> uses ≈7,700 kcal per kg of body fat. Pace is capped at 1% of body weight per week, and the target never drops below 1,200 kcal (women) or 1,500 kcal (men).</p>
    <p><b>Macros</b>: protein at 1.6 g/kg (adjusted weight above BMI 25) to protect muscle; fat at 28% of calories; carbs fill the rest. Fiber at 14 g per 1,000 kcal. Sodium limit is the WHO's 2,000 mg.</p>
    <p><b>Steps and activity</b>: your plan already counts a usual day of walking for your activity level (about 5,000 steps if sedentary, 7,500 lightly active, 10,000 moderately active, 12,500 very active), so only steps above that count. Step length is about 41% of your height, and walking burns about 0.5 kcal per kg per km above resting. Activities use standard MET values: (MET − 1) × weight in kg × hours. Plato adds half of the estimate to your target, up to 500 kcal a day, because exercise estimates usually run high.</p>
    <p><b>BMI</b> uses the WHO Asian cut-offs (overweight from 23), which fit Filipino adults better.</p>
    <p>These are estimates. If your weight doesn't move after 3–4 weeks of consistent logging, lower the target by 100–200 kcal. This isn't medical advice — check with a doctor if you're pregnant, breastfeeding, diabetic or on medication.</p>
  </div>
  <p class="muted small" style="margin-top:18px">Pluto image: NASA / Johns Hopkins APL / Southwest Research Institute (New Horizons), color-adjusted for Plato.</p>`;
}

/* ============ binding ============ */
function bindView(){
  const app=$("#app");
  if(S.tab==="workout" && S.settings.setupDone) bindWorkout(app);
  app.querySelectorAll("[data-setup]").forEach(b=>b.onclick=()=>{ S.settings.setupDone=true; saveSettings(); S.tab="me"; render(); });
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ S.date=addDays(S.date,+b.dataset.day); if(S.date>dstr()) S.date=dstr(); loadDay(); render(); });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.go; render(); });
  app.querySelectorAll("[data-glass]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.glass; S.day.water=S.day.water===i+1?i:i+1; saveDay(); render(); });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const e=S.day.entries.find(x=>x.id===b.dataset.del); if(!confirm(`Delete ${e?.name||"this entry"}?`)) return; S.day.entries=S.day.entries.filter(x=>x.id!==b.dataset.del); saveDay(); render(); });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditSheet(b.dataset.edit));
  app.querySelectorAll("[data-steps]").forEach(b=>b.onclick=()=>{ L={step:"steps",steps:S.day.steps||0}; openSheet(); drawSheet(); });
  app.querySelectorAll("[data-addact]").forEach(b=>b.onclick=()=>{ L={step:"act",type:"walk",min:30,int:"moderate"}; openSheet(); drawSheet(); });
  app.querySelectorAll("[data-actdel]").forEach(b=>b.onclick=()=>{ const a=(S.day.acts||[]).find(x=>x.id===b.dataset.actdel), A=ACTS.find(x=>x[0]===a?.type); if(!confirm(`Remove ${A?.[2]||"this activity"}?`)) return; S.day.acts=S.day.acts.filter(x=>x.id!==b.dataset.actdel); saveDay(); renderKeepScroll(); });
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openLogSheet(b.dataset.add));
  app.querySelectorAll("[data-recent]").forEach(b=>b.onclick=()=>{ const r=S.recents[+b.dataset.recent]; S.day.entries.push({...r,id:uid(),meal:mealForNow(),time:Date.now()}); saveDay(); toast(`Added ${r.name}`); render(); });
  app.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{ S.progRange=+b.dataset.range; render(); });
  app.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{ S.weights=S.weights.filter(w=>w.date!==b.dataset.wdel); Store.set("weights",S.weights); render(); });
  const ws=$("#wSave"); if(ws) ws.onclick=()=>{ const v=parseFloat($("#wIn").value); if(!(v>=25&&v<=350)) return toast("Enter a weight between 25 and 350 kg"); logWeight(v); toast("Weight saved"); render(); $("#weightSec")?.scrollIntoView(); };

  app.querySelectorAll("[data-donate]").forEach(b=>b.onclick=()=>{ Store.set("nudged",true); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
  app.querySelectorAll("[data-nudge-x]").forEach(b=>b.onclick=()=>{ Store.set("nudged",true); render(); });

  // plan form
  const tmp={...(S.profile||{sex:"female",activity:1.375,pace:0.5})};
  app.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{ tmp.sex=b.dataset.sex; app.querySelectorAll("[data-sex]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  app.querySelectorAll("[data-pace]").forEach(b=>b.onclick=()=>{ tmp.pace=+b.dataset.pace; app.querySelectorAll("[data-pace]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const ps=$("#pSave"); if(ps) ps.onclick=()=>{
    const age=+$("#pAge").value, h=+$("#pH").value, w=+$("#pW").value, g=+$("#pG").value;
    if(!(age>=18&&age<=100)) return toast("This calculator is for adults 18 and over");
    if(!(h>=120&&h<=230)) return toast("Enter your height in cm (120–230)");
    if(!(w>=25&&w<=350)) return toast("Enter your current weight in kg");
    if(g&&!(g>=25&&g<=350)) return toast("Enter a goal weight in kg");
    S.profile={...tmp,age,heightCm:h,goalKg:g||w,activity:+$("#pAct").value,startKg:S.profile?.startKg||w};
    if(currentWeight()!==w) logWeight(w);
    Store.set("profile",S.profile); toast("Plan saved 🎯"); render();
  };

  // updates
  const cu=$("#chkUpd"); if(cu) cu.onclick=()=>checkForUpdate(true);
  const sn=$("#seeNew"); if(sn) sn.onclick=()=>{ if(!U.releases.length) return toast("Release notes aren't available offline yet"); showWhatsNew(U.releases.slice(0,5),"Release notes"); };

  // install / backup
  const ins=$("#install"); if(ins) ins.onclick=async()=>{ S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt=null; render(); };
  const ex=$("#exp"); if(ex) ex.onclick=()=>{
    const data={app:"plato",version:1,exported:new Date().toISOString(),data:{}};
    for(const k of Store.keys()){ if(["plato:settings","plato:device","plato:scans"].includes(k)) continue; data.data[k]=localStorage.getItem(k); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"})); a.download=`plato-backup-${dstr()}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast("Backup downloaded");
  };
  const im=$("#imp"); if(im) im.onchange=async()=>{
    const f=im.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(d.app!=="plato"||!d.data) throw 0;
      if(!confirm("Replace the data on this device with this backup?")) return;
      for(const k of Store.keys()) if(!["plato:settings","plato:device","plato:scans"].includes(k)) localStorage.removeItem(k);
      for(const [k,v] of Object.entries(d.data)) if(k.startsWith("plato:")&&!["plato:settings","plato:device","plato:scans"].includes(k)) localStorage.setItem(k,v);
      location.reload();
    }catch(e){ toast("That file isn't a Plato backup"); }
  };
  const wp=$("#wipe"); if(wp) wp.onclick=()=>{ if(!confirm("Erase your plan, food log and weights from this device? This can't be undone.")) return; for(const k of Store.keys()) if(k!=="plato:device") localStorage.removeItem(k); location.reload(); };
}
function logWeight(v){ const d=dstr(); S.weights=S.weights.filter(x=>x.date!==d).concat({date:d,kg:r1(v)}).sort((a,b)=>a.date<b.date?-1:1); Store.set("weights",S.weights); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; if(S.tab==="today"){ S.date=S.date; } render(); });
$("#fab").onclick=()=>openLogSheet(mealForNow());

/* ============ log sheet ============ */
let L=null;
function openSheet(){ $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); }
function closeSheet(){ L?.ctl?.abort(); L=null; onSheetClose(); $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#sheet").classList.contains("open")) closeSheet(); });
function openLogSheet(meal){ L={meal,step:"pick",file:null,url:null,note:"",items:[],notes:"",mode:"photo"}; openSheet(); drawSheet(); }
function sheetHead(title){ return `<div class="grab"></div><div class="sheet-head"><h3 id="sheetTitle">${title}</h3><button class="iconbtn" data-close aria-label="Close">✕</button></div>`; }
function mealSelect(){ return `<select class="inp" id="lMeal" aria-label="Meal">${MEALS.map(([k,l])=>`<option value="${k}" ${L.meal===k?"selected":""}>${l}</option>`).join("")}</select>`; }

function drawSheet(){
  const b=$("#sheetBody"); if(!L) return;
  const aiOn=!!CONFIG.WORKER_URL, online=navigator.onLine, left=scansLeft(), outOfScans=left===0;
  if(L.step==="pick"){
    b.innerHTML=sheetHead("Log food")+`
      ${!aiOn?`<div class="note">${errText({code:"off"})}</div>`
        :outOfScans?`<div class="note">${errText({code:"limit"})}${hasDonate()?` <a href="#" data-donate-link>Support Plato</a> to help keep scans free.`:""}</div>`
        :!online?`<div class="note">You're offline. Photo analysis needs internet — use quick add or recent foods for now.</div>`
        :`<div class="pick">
          <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo<input type="file" accept="image/*" capture="environment" data-file></label>
          <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>From gallery<input type="file" accept="image/*" data-file></label>
        </div>
        ${left!==null?`<p class="muted small" style="text-align:center;margin:8px 0 0">${left} photo scan${left===1?"":"s"} left today</p>`:""}
        <h2 style="margin-top:18px">Or describe it</h2>
        <textarea class="inp" id="lDesc" rows="2" placeholder="e.g. 1 cup rice, 2 pcs chicken adobo, 1 banana"></textarea>
        <button class="btn ghost" id="lDescGo" style="margin-top:8px">Estimate from description</button>`}
      <h2>Quick add</h2>
      <div class="stack">
        <input class="inp" id="qName" placeholder="Food name">
        <div class="row"><input class="inp" id="qK" type="number" inputmode="numeric" placeholder="kcal"><input class="inp" id="qP" type="number" inputmode="decimal" placeholder="Protein g"></div>
        <div class="row"><input class="inp" id="qC" type="number" inputmode="decimal" placeholder="Carbs g"><input class="inp" id="qF" type="number" inputmode="decimal" placeholder="Fat g"></div>
        ${mealSelect()}
        <button class="btn" id="qGo">Add</button>
      </div>`;
    b.querySelectorAll("[data-donate-link]").forEach(x=>x.onclick=e=>{ e.preventDefault(); closeSheet(); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
    b.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; L.file=f; L.url=URL.createObjectURL(f); L.step="confirm"; drawSheet(); });
    const dg=$("#lDescGo"); if(dg) dg.onclick=()=>{ const t=$("#lDesc").value.trim(); if(!t) return toast("Describe what you ate first"); L.note=t; L.mode="text"; L.meal=$("#lMeal").value; analyze(); };
    $("#qGo").onclick=()=>{ const name=$("#qName").value.trim()||"Quick add", k=+$("#qK").value; if(!(k>0)) return toast("Enter the calories"); L.meal=$("#lMeal").value;
      commitEntry({name,kcal:k,p:+$("#qP").value||0,c:+$("#qC").value||0,f:+$("#qF").value||0,fiber:0,sugar:0,sodium:0,thumb:null}); };
  }
  else if(L.step==="confirm"){
    b.innerHTML=sheetHead("Analyze photo")+`<img class="preview" src="${L.url}" alt="Your food photo">
      <label class="f" for="lNote" style="margin-top:12px">Anything the photo can't show? (optional)</label>
      <input class="inp" id="lNote" placeholder="e.g. fried in butter, 1.5 cups rice, no sauce" value="${esc(L.note)}">
      <div style="margin-top:10px">${mealSelect()}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Retake</button><button class="btn" id="lGo">Analyze ✨</button></div>`;
    $("#lGo").onclick=()=>{ L.note=$("#lNote").value.trim(); L.meal=$("#lMeal").value; L.mode="photo"; analyze(); };
  }
  else if(L.step==="loading"){
    b.innerHTML=sheetHead("Analyzing")+`${L.url&&L.mode==="photo"?`<img class="preview" src="${L.url}" alt="">`:""}<div class="spinner"></div><p class="muted" style="text-align:center">Identifying foods and estimating portions. This takes about 5–15 seconds.</p><button class="btn ghost" data-stop>Stop</button>`;
    b.querySelector("[data-stop]").onclick=()=>{ L.ctl?.abort(); L.step=L.mode==="photo"?"confirm":"pick"; drawSheet(); };
  }
  else if(L.step==="error"){
    b.innerHTML=sheetHead("Couldn't analyze")+`<div class="note warn">${esc(L.err)}</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Back</button>${L.retry?`<button class="btn" id="lRetry">Try again</button>`:""}</div>
      ${["limit","capacity","credits","quota"].includes(L.errCode)&&hasDonate()?`<button class="btn" data-donate-link style="margin-top:10px">Support Plato ☕</button>`:""}`;
    b.querySelectorAll("[data-donate-link]").forEach(x=>x.onclick=e=>{ e.preventDefault(); closeSheet(); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
    const rt=$("#lRetry"); if(rt) rt.onclick=()=>analyze();
  }
  else if(L.step==="review"){
    const tot=itemTotals();
    b.innerHTML=sheetHead("Check and save")+`
      ${L.url&&L.mode==="photo"?`<img class="preview" src="${L.url}" alt="" style="max-height:160px">`:""}
      ${L.items.length?"":`<div class="note warn" style="margin-top:10px">No food found. ${esc(L.notes)}</div>`}
      ${L.items.map((it,i)=>`<div class="item">
        <div class="item-top"><input value="${esc(it.name)}" data-iname="${i}" aria-label="Food name"><button class="iconbtn" data-irm="${i}" aria-label="Remove ${esc(it.name)}">✕</button></div>
        <div class="muted small">${esc(it.portion||"")}${it.grams?` · ~${r0(it.grams*it.mult)} g`:""}</div>
        <div class="item-meta">
          <div class="portion"><button data-im="${i}" data-d="-1" aria-label="Smaller portion">−</button><span>×${it.mult}</span><button data-im="${i}" data-d="1" aria-label="Bigger portion">+</button></div>
          <div><b>${r0(it.kcal*it.mult)}</b> kcal <span class="muted small">P ${r0(it.protein_g*it.mult)} · C ${r0(it.carbs_g*it.mult)} · F ${r0(it.fat_g*it.mult)}</span></div>
        </div></div>`).join("")}
      ${L.notes&&L.items.length?`<p class="muted small" style="margin:10px 2px 0">${esc(L.notes)}${L.confidence?` (confidence: ${esc(L.confidence)})`:""}</p>`:""}
      <div class="totals"><div><span class="muted">Total</span><br><b>${r0(tot.kcal)} kcal</b></div><div style="text-align:right">P ${r0(tot.p)} · C ${r0(tot.c)} · F ${r0(tot.f)} g<br><span class="muted">Fiber ${r0(tot.fiber)} g · Sodium ${r0(tot.sodium)} mg</span></div></div>
      <div style="margin-top:10px">${mealSelect()}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Start over</button><button class="btn" id="lSave" ${L.items.length?"":"disabled"}>Save to log</button></div>`;
    b.querySelectorAll("[data-iname]").forEach(inp=>inp.oninput=()=>{ L.items[+inp.dataset.iname].name=inp.value; });
    b.querySelectorAll("[data-irm]").forEach(x=>x.onclick=()=>{ L.items.splice(+x.dataset.irm,1); drawSheet(); });
    const steps=[0.25,0.5,0.75,1,1.25,1.5,2,2.5,3];
    b.querySelectorAll("[data-im]").forEach(x=>x.onclick=()=>{ const it=L.items[+x.dataset.im]; let k=steps.indexOf(it.mult); k=Math.max(0,Math.min(steps.length-1,k+ +x.dataset.d)); it.mult=steps[k]; drawSheet(); });
    $("#lMeal").onchange=e=>L.meal=e.target.value;
    $("#lSave").onclick=async()=>{ L.meal=$("#lMeal").value; const t=itemTotals(), name=L.items.map(i=>i.name).join(", "), thumb=L.file?await makeThumb(L.file):null;
      commitEntry({name,kcal:t.kcal,p:t.p,c:t.c,f:t.f,fiber:t.fiber,sugar:t.sugar,sodium:t.sodium,thumb}); };
  }
  else if(L.step==="steps"){
    const isToday=S.date===dstr();
    b.innerHTML=sheetHead(isToday?"Today's steps":`Steps on ${prettyDate(S.date)}`)+`
      <label class="f" for="sIn">${isToday?"Steps so far today":"Steps that day"}</label>
      <input class="big-in" id="sIn" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${L.steps?L.steps.toLocaleString():""}">
      <div class="chips" style="margin-top:10px">${[500,1000,2500].map(n=>`<button class="chip" data-plus="${n}">+${n.toLocaleString()}</button>`).join("")}<button class="chip" data-plus="0">Clear</button></div>
      <p class="muted small" style="margin:4px 0 0">Find it in the Health app (iPhone), Google Fit or Samsung Health (Android), or your watch.</p>
      <div class="est" id="sEst"></div>
      <button class="btn" id="sSave" style="margin-top:12px">Save steps</button>`;
    const inp=$("#sIn"), est=()=>{ const sb=stepsBurn(L.steps), u=usualSteps();
      $("#sEst").innerHTML=!calcPlan()?`<p>Set up your plan on the Me tab so Plato can work out what your steps burn.</p>`:`
        <div class="line"><span>Walking above your usual day</span><b>${sb.km.toFixed(1)} km</b></div>
        <div class="line"><span>Calories burned on those steps</span><b>≈ ${r0(sb.burn).toLocaleString()} kcal</b></div>
        <div class="line"><span>Added to the day's target</span><b class="plus">+${r0(sb.burn*EARN_SHARE).toLocaleString()} kcal</b></div>
        <p>Your plan (${ACTIVITY.find(a=>a[0]===+S.profile.activity)?.[1]||"your activity level"}) already counts about ${u.toLocaleString()} steps a day, so only the steps above that count. Plato adds half of what they burn, to keep your deficit safe.</p>`; };
    inp.oninput=()=>{ L.steps=Math.min(parseInt(inp.value.replace(/[^0-9]/g,""),10)||0,100000); est(); };
    b.querySelectorAll("[data-plus]").forEach(x=>x.onclick=()=>{ const n=+x.dataset.plus; L.steps=n?Math.min(L.steps+n,100000):0; inp.value=L.steps?L.steps.toLocaleString():""; est(); });
    est();
    $("#sSave").onclick=()=>{ if(L.steps) S.day.steps=L.steps; else delete S.day.steps; saveDay(); const had=!!L.steps; closeSheet(); toast(had?"Steps saved ✅":"Steps cleared"); renderKeepScroll(); };
  }
  else if(L.step==="act"){
    const burn=actBurn(L.type,L.min,L.int), A=ACTS.find(x=>x[0]===L.type), isToday=S.date===dstr();
    b.innerHTML=sheetHead("Add activity")+`
      <label class="f" id="aLbl">What did you do?</label>
      <div class="acts" role="group" aria-labelledby="aLbl">${ACTS.map(([k,e,n])=>`<button data-atype="${k}" aria-pressed="${L.type===k}"><span>${e}</span>${n}</button>`).join("")}</div>
      <label class="f" id="mLbl" style="margin-top:14px">How long?</label>
      <div class="stepper" role="group" aria-labelledby="mLbl"><button data-amin="-5" aria-label="5 minutes less">−</button><output>${L.min} min</output><button data-amin="5" aria-label="5 minutes more">+</button>
        <div class="chips">${[15,30,60].map(m=>`<button class="chip" data-aset="${m}" aria-pressed="${L.min===m}">${m}</button>`).join("")}</div></div>
      <label class="f" id="iLbl" style="margin-top:14px">How hard?</label>
      <div class="seg" role="group" aria-labelledby="iLbl">${Object.entries(INTENSITY).map(([k,[,l]])=>`<button data-aint="${k}" aria-pressed="${L.int===k}">${l}</button>`).join("")}</div>
      <div class="est">${!currentWeight()?`<p>Set up your plan on the Me tab so Plato can work out what this burns.</p>`:`
        <div class="line"><span>${A[2]}, ${L.min} min</span><b>≈ ${r0(burn).toLocaleString()} kcal burned</b></div>
        <div class="line"><span>Added to the day's target</span><b class="plus">+${r0(burn*EARN_SHARE).toLocaleString()} kcal</b></div>
        <p>Plato adds half, because exercise estimates usually run high. Your total extra is capped at ${EARN_CAP} kcal a day.</p>`}</div>
      <button class="btn" id="aSave" style="margin-top:12px">Add to ${isToday?"today":prettyDate(S.date)}</button>`;
    b.querySelectorAll("[data-atype]").forEach(x=>x.onclick=()=>{ L.type=x.dataset.atype; drawSheet(); });
    b.querySelectorAll("[data-amin]").forEach(x=>x.onclick=()=>{ L.min=Math.max(5,Math.min(300,L.min+ +x.dataset.amin)); drawSheet(); });
    b.querySelectorAll("[data-aset]").forEach(x=>x.onclick=()=>{ L.min=+x.dataset.aset; drawSheet(); });
    b.querySelectorAll("[data-aint]").forEach(x=>x.onclick=()=>{ L.int=x.dataset.aint; drawSheet(); });
    $("#aSave").onclick=()=>{ S.day.acts=(S.day.acts||[]).concat({id:uid(),type:L.type,min:L.min,int:L.int,kcal:r0(burn),time:Date.now()}); saveDay(); const nm=A[2]; closeSheet(); toast(`${nm} added ✅`); renderKeepScroll(); };
  }
  else if(L.step==="edit"){
    const e=S.day.entries.find(x=>x.id===L.editId); if(!e) return closeSheet();
    const fld=(id,label,val,step)=>`<div><label class="f" for="${id}">${label}</label><input class="inp" id="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${val}"></div>`;
    b.innerHTML=sheetHead("Edit food")+`
      ${e.thumb?`<img class="preview" src="${e.thumb}" alt="" style="width:120px;height:120px;margin:0 auto 12px">`:""}
      <div class="stack">
        <div><label class="f" for="eName">Food name</label><input class="inp" id="eName" maxlength="200" value="${esc(e.name)}"></div>
        <div><label class="f" for="lMeal">Meal</label>${mealSelect()}</div>
        <div><label class="f">Ate more or less? Scale everything</label>
          <div class="chips" style="margin:0">${[[0.5,"½×"],[0.75,"¾×"],[1.25,"1¼×"],[1.5,"1½×"],[2,"2×"]].map(([m,l])=>`<button class="chip" data-scale="${m}" aria-label="Multiply all values by ${m}">${l}</button>`).join("")}</div></div>
        <div class="row">${fld("eK","Calories (kcal)",r0(e.kcal),1)}${fld("eP","Protein (g)",r1(e.p),0.1)}</div>
        <div class="row">${fld("eC","Carbs (g)",r1(e.c),0.1)}${fld("eF","Fat (g)",r1(e.f),0.1)}</div>
        <div class="row">${fld("eFi","Fiber (g)",r1(e.fiber),0.1)}${fld("eSu","Sugar (g)",r1(e.sugar),0.1)}</div>
        ${fld("eNa","Sodium (mg)",r0(e.sodium),1)}
      </div>
      <div class="row" style="margin-top:14px"><button class="btn danger" id="eDel">Delete</button><button class="btn" id="eSave">Save changes</button></div>`;
    const FIELDS=[["eK","kcal",0],["eP","p",1],["eC","c",1],["eF","f",1],["eFi","fiber",1],["eSu","sugar",1],["eNa","sodium",0]];
    b.querySelectorAll("[data-scale]").forEach(x=>x.onclick=()=>{ const m=+x.dataset.scale;
      for(const [id,,dp] of FIELDS){ const el=$("#"+id), v=parseFloat(el.value); if(v>=0) el.value=dp?r1(v*m):r0(v*m); }
      toast(`All amounts ×${m}`); });
    $("#eSave").onclick=()=>{
      if($("#eK").value.trim()==="") return toast("Enter the calories");
      const vals={};
      for(const [id,key,dp] of FIELDS){ const raw=$("#"+id).value.trim(), n=raw===""?0:Number(raw);
        if(!Number.isFinite(n)||n<0) return toast("Amounts can't be negative"); vals[key]=dp?r1(n):r0(n); }
      const oldName=e.name;
      Object.assign(e,vals,{name:$("#eName").value.trim()||oldName,meal:$("#lMeal").value,edited:Date.now()});
      saveDay();
      // Keep "log again" chips in sync with the corrected values
      const ri=S.recents.findIndex(r=>r.name.toLowerCase()===oldName.toLowerCase());
      if(ri>=0){ const {id,meal,time,thumb,edited,...rest}=e; S.recents[ri]=rest; S.recents=S.recents.filter((r,i)=>i===ri||r.name.toLowerCase()!==rest.name.toLowerCase()); Store.set("recents",S.recents); }
      closeSheet(); toast("Changes saved ✅"); renderKeepScroll();
    };
    $("#eDel").onclick=()=>{ if(!confirm(`Delete ${e.name}?`)) return; S.day.entries=S.day.entries.filter(x=>x.id!==e.id); saveDay(); closeSheet(); toast("Deleted"); renderKeepScroll(); };
  }
  b.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
  b.querySelectorAll("[data-back]").forEach(x=>x.onclick=()=>{ L.items=[]; L.step="pick"; L.file=null; L.url=null; drawSheet(); });
}
function openEditSheet(id){ const e=S.day.entries.find(x=>x.id===id); if(!e) return; L={step:"edit",editId:id,meal:e.meal}; openSheet(); drawSheet(); }
function renderKeepScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function itemTotals(){ const t={kcal:0,p:0,c:0,f:0,fiber:0,sugar:0,sodium:0}; for(const it of L.items){ t.kcal+=it.kcal*it.mult; t.p+=it.protein_g*it.mult; t.c+=it.carbs_g*it.mult; t.f+=it.fat_g*it.mult; t.fiber+=it.fiber_g*it.mult; t.sugar+=it.sugar_g*it.mult; t.sodium+=it.sodium_mg*it.mult; } return t; }
function commitEntry(e){
  const entry={id:uid(),meal:L.meal,time:Date.now(),...e,kcal:r0(e.kcal),p:r1(e.p),c:r1(e.c),f:r1(e.f),fiber:r1(e.fiber),sugar:r1(e.sugar),sodium:r0(e.sodium)};
  S.day.entries.push(entry); saveDay(); Store.set("logCount",Store.get("logCount",0)+1);
  const {id,meal,time,thumb,...rest}=entry;
  S.recents=[rest,...S.recents.filter(r=>r.name.toLowerCase()!==rest.name.toLowerCase())].slice(0,15); Store.set("recents",S.recents);
  closeSheet(); toast(`Logged ${r0(entry.kcal)} kcal ✅`); S.tab="today"; render();
}
async function makeThumb(file){
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const s=120,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const m=Math.min(img.width,img.height);
    cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s); return cv.toDataURL("image/jpeg",0.55);
  }catch(e){ return null; }
}

async function analyze(){
  if(!CONFIG.WORKER_URL){ L.err=errText({code:"off"}); L.errCode="off"; L.retry=false; L.step="error"; return drawSheet(); }
  L.step="loading"; drawSheet(); L.ctl=new AbortController();
  try{
    const image=L.mode==="photo"?await fileToBase64Jpeg(L.file):undefined;
    const res=await callWorker({mode:L.mode,note:L.note,image},L.ctl.signal);
    if(!L) return;
    const num=v=>Math.max(0,Number(v)||0);
    L.items=(Array.isArray(res.items)?res.items:[]).map(it=>({name:String(it.name||"Food").slice(0,80),portion:String(it.portion||"").slice(0,80),grams:num(it.grams),kcal:num(it.kcal),protein_g:num(it.protein_g),carbs_g:num(it.carbs_g),fat_g:num(it.fat_g),fiber_g:num(it.fiber_g),sugar_g:num(it.sugar_g),sodium_mg:num(it.sodium_mg),mult:1}));
    L.notes=String(res.notes||""); L.confidence=String(res.confidence||""); L.step="review"; drawSheet();
  }catch(e){
    if(!L||e?.code==="cancelled") return;
    L.err=errText(e); L.errCode=e?.code;
    L.retry=!["config","forbidden","off","limit","capacity","credits","quota"].includes(e?.code); L.step="error"; drawSheet();
  }
}

/* ============ update notifications ============ */
// Release notes live in version.json. To ship an update: add a new entry at the TOP of
// "releases" in version.json and bump VERSION in sw.js. Open apps check every 30 minutes
// and whenever they're reopened; when a newer version is found they show a "Refresh" bar.
// After updating, each person sees the new notes once in a "What's new" sheet.
const U={running:null,releases:[],latest:null,lastCheck:0};
async function fetchReleases(){
  const res=await fetch("version.json",{cache:"no-store"}); if(!res.ok) throw 0;
  const d=await res.json(), rel=Array.isArray(d.releases)?d.releases.filter(r=>r&&r.version):[];
  if(!rel.length) throw 0; return rel;
}
function versionText(){ const r=U.releases[0]; return r?`You're on Plato <b style="color:var(--ink)">${esc(r.version)}</b>${r.date?` (${esc(new Date(r.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))})`:""}. Plato checks for updates automatically and lets you know when something new is out.`:"Plato checks for updates automatically and lets you know when something new is out."; }
async function initUpdates(){
  try{ U.releases=await fetchReleases(); }catch(e){ return; }
  U.running=U.releases[0].version; U.lastCheck=Date.now();
  const v=$("#appVer"); if(v) v.innerHTML=versionText();
  const seen=Store.get("seenVersion",null);
  if(seen===U.running) return;
  Store.set("seenVersion",U.running);
  // Brand-new users don't need release notes; existing users see what changed since their last visit.
  if(!S.settings.setupDone||!S.profile||$("#sheet").classList.contains("open")||document.body.classList.contains("playing")) return;
  const i=U.releases.findIndex(r=>r.version===seen);
  showWhatsNew(U.releases.slice(0,i>0?Math.min(i,3):1),"What's new ✨");
}
async function checkForUpdate(manual){
  U.lastCheck=Date.now();
  navigator.serviceWorker?.getRegistration().then(r=>r?.update()).catch(()=>{});
  let rel; try{ rel=await fetchReleases(); }
  catch(e){ if(manual) toast(navigator.onLine?"Couldn't check for updates right now":"You're offline — connect to check for updates"); return; }
  if(!U.running){ U.releases=rel; U.running=rel[0].version; }
  if(rel[0].version!==U.running){ U.latest=rel[0]; showUpdateBar(); }
  else if(manual) toast("You're on the latest version ✅");
}
function showUpdateBar(){
  const bar=$("#updBar"), r=U.latest;
  bar.innerHTML=`<p>✨ Plato has been updated<small>${r?.title?`${esc(r.title)}. `:""}Refresh to get the new version.</small></p><button class="btn sm" id="updGo">Refresh</button><button class="iconbtn" id="updX" aria-label="Dismiss">✕</button>`;
  bar.classList.remove("hidden");
  $("#updGo").onclick=applyUpdate;
  $("#updX").onclick=()=>bar.classList.add("hidden");
}
async function applyUpdate(){
  const go=$("#updGo"); if(go){ go.disabled=true; go.textContent="Refreshing…"; }
  // Pull fresh copies of the app files past the browser cache, then reload into them.
  try{
    const r=await navigator.serviceWorker?.getRegistration(); await r?.update().catch(()=>{});
    await Promise.race([Promise.allSettled(["./","index.html","exercises.js","workout.js","coach3d.js","version.json"].map(u=>fetch(u,{cache:"reload"}))),new Promise(res=>setTimeout(res,8000))]);
  }catch(e){}
  location.reload();
}
function showWhatsNew(list,title){
  L=null; openSheet();
  const b=$("#sheetBody");
  b.innerHTML=sheetHead(esc(title))+list.map(r=>`<div class="rel"><div class="rel-head"><h3>${esc(r.title||"Improvements")}</h3><span class="muted small">${esc(r.version)}${r.date?` · ${esc(new Date(r.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}))}`:""}</span></div>
    ${Array.isArray(r.notes)&&r.notes.length?`<ul class="tips">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>`).join("")+
    `<button class="btn" data-close style="margin-top:14px">Got it</button>`;
  b.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&Date.now()-U.lastCheck>5*60e3) checkForUpdate(false); });
setInterval(()=>{ if(!document.hidden) checkForUpdate(false); },30*60e3);

/* ============ boot ============ */
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); S.installEvt=e; if(S.tab==="me") render(); });
window.addEventListener("online",()=>{ if(!L) render(); });
window.addEventListener("offline",()=>{ if(!L) render(); });
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
// If the app was left open overnight, jump to the new day when it's reopened
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.date<dstr() && S._lastToday===S.date){ S.date=dstr(); loadDay(); render(); } S._lastToday=dstr(); });
S._lastToday=dstr();
if(S.settings.apiKey!==undefined||S.settings.model!==undefined){ delete S.settings.apiKey; delete S.settings.model; saveSettings(); }
loadDay();
if(S.settings.setupDone&&!S.profile) S.tab="me";
render();
initUpdates();
setTimeout(checkMoons,1500);
</script>
