<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plato — Calorie Tracker</title>
<meta name="description" content="Snap your food, track calories, reach your goal.">
<meta name="theme-color" content="#6D28FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plato">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4FF; --surface:#FFFFFF; --surface2:#EFEAFF; --ink:#1C1433; --muted:#6B6385; --line:#E4DCF8;
  --primary:#6D28FF; --pink:#FF2E7E; --orange:#FF8A00; --lime:#3DBE29; --sky:#0096F0; --red:#F2352B;
  --protein:#0096F0; --carb:#FF8A00; --fat:#FF2E7E; --water:#00B4F0;
  --grad:linear-gradient(135deg,#6D28FF 0%,#C026D3 55%,#FF2E7E 100%);
  --grad-warm:linear-gradient(135deg,#FF2E7E 0%,#FF8A00 100%);
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120C24; --surface:#1D1536; --surface2:#2A1F4D; --ink:#F4F0FF; --muted:#AA9FCC; --line:#342A5C;
    --primary:#A07BFF; --pink:#FF5C9D; --orange:#FFA533; --lime:#7EE05E; --sky:#3BC0FF; --red:#FF6259;
    --protein:#3BC0FF; --carb:#FFA533; --fat:#FF5C9D; --water:#3BC0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#120C24; --surface:#1D1536; --surface2:#2A1F4D; --ink:#F4F0FF; --muted:#AA9FCC; --line:#342A5C;
  --primary:#A07BFF; --pink:#FF5C9D; --orange:#FFA533; --lime:#7EE05E; --sky:#3BC0FF; --red:#FF6259;
  --protein:#3BC0FF; --carb:#FFA533; --fat:#FF5C9D; --water:#3BC0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
img{max-width:100%}
a{color:var(--primary)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;gap:8px}
.brand{font-weight:800;font-size:1.7rem;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:1.1rem;color:var(--primary);font-weight:700}
.datenav button:disabled{opacity:.35}
.datenav span{font-weight:700;min-width:100px;text-align:center;font-size:.95rem}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px}
h3{font-size:1rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border-radius:20px;padding:16px}
.stack>*+*{margin-top:12px}

.streak{display:inline-flex;align-items:center;gap:4px;background:var(--grad-warm);color:#fff;font-weight:800;border-radius:999px;padding:4px 10px;font-size:.85rem}
.offline{background:var(--surface2);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:.85rem;margin-top:6px}

/* plate hero */
.hero{display:grid;place-items:center;padding:6px 0 0;position:relative}
.plate{width:min(76vw,300px);aspect-ratio:1}
.plate-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.plate-num{font-size:clamp(2.7rem,12vw,3.7rem);font-weight:800;letter-spacing:-.045em;line-height:1}
.plate-lbl{font-size:.9rem;color:var(--muted);margin-top:4px;font-weight:600}
.plate-sub{display:flex;justify-content:center;gap:22px;margin-top:6px;font-size:.85rem}
.plate-sub b{display:block;font-size:1.1rem;color:var(--ink)}
.over .plate-num{color:var(--red)}
.cheer{text-align:center;font-weight:700;margin:4px 0 0;color:var(--primary)}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro{border-radius:16px;padding:10px 12px;background:var(--surface)}
.macro .name{font-size:.8rem;font-weight:700}
.macro .val{font-weight:800;font-size:1.05rem}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px}
.micros{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;border:0;font-weight:600}
.chip.warn{background:color-mix(in srgb,var(--red) 16%,var(--surface));color:var(--red)}

.water{display:flex;align-items:center;gap:10px;justify-content:space-between}
.glasses{display:flex;gap:5px;flex-wrap:wrap}
.glass{width:24px;height:30px;border:2.5px solid var(--water);border-radius:3px 3px 8px 8px;background:transparent;padding:0}
.glass.full{background:var(--water)}

.meal{margin-top:12px;border-left:5px solid var(--mc)}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal-head+.entry,.wlist .entry:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--surface2);flex:none;display:grid;place-items:center;font-size:1.3rem}
.entry .info{flex:1;min-width:0}
.entry .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .kc{font-weight:800;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:1.05rem;flex:none}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.recents{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.recents .chip{white-space:nowrap;border:2px solid var(--surface2)}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;align-items:center;height:64px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);height:100%;justify-content:center;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary);font-weight:800}
.fab{justify-self:center;width:68px;height:68px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;transform:translateY(-18px);box-shadow:0 8px 22px color-mix(in srgb,var(--pink) 45%,transparent)}
.fab svg{width:30px;height:30px}
body.setup nav.tabs{display:none}

.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:800;background:var(--grad);color:#fff;width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.inp{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px 12px}
.inp:focus{border-color:var(--primary);outline:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:.9rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:800}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:12px;color:#fff}
.stat span{opacity:.9;font-size:.82rem;font-weight:600}
.stat b{display:block;font-size:1.4rem;letter-spacing:-.02em}
.s1{background:linear-gradient(135deg,#6D28FF,#9B5CFF)}
.s2{background:linear-gradient(135deg,#FF2E7E,#FF6FA5)}
.s3{background:linear-gradient(135deg,#FF8A00,#FFB347)}
.s4{background:linear-gradient(135deg,#0096F0,#3BC0FF)}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:300px}
.wlist .entry{padding:8px 0}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:.9rem}
.note.warn{background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.note.good{background:color-mix(in srgb,var(--lime) 18%,var(--surface))}
.target-card{background:var(--grad);color:#fff}
.target-card .muted{color:rgba(255,255,255,.8)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.method{font-size:.88rem;color:var(--muted)}
.method p{margin:6px 0}
.method b{color:var(--ink)}

/* setup */
.setup-hero{text-align:center;padding:30px 4px 10px}
.setup-hero .big{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:14px 0 8px}
.setup-hero img{width:96px;height:96px;border-radius:24px}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.steps-dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.steps-dots i.on{width:22px;background:var(--primary)}
ol.howto{padding-left:20px;margin:8px 0;font-size:.9rem}
ol.howto li{margin:4px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.5);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.preview{width:100%;max-height:240px;object-fit:cover;border-radius:18px;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;padding:20px 8px;font-weight:800;cursor:pointer;text-align:center;color:#fff}
.pick label:first-child{background:var(--grad)}
.pick label:last-child{background:var(--grad-warm)}
.pick svg{width:30px;height:30px}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.item{background:var(--surface);border-radius:16px;padding:12px;margin-top:10px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input{flex:1;background:transparent;border:0;border-bottom:2px dashed var(--line);padding:4px 0;font-weight:700}
.item-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.portion{display:flex;align-items:center;gap:6px}
.portion button{width:32px;height:32px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-weight:800}
.portion span{min-width:44px;text-align:center;font-weight:800}
.totals{display:flex;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px;margin-top:12px;font-size:.9rem}
.totals b{font-size:1.25rem}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid var(--surface2);border-top-color:var(--pink);border-right-color:var(--primary);animation:spin 1s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}.spinner{animation-duration:3s}}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Today</button>
    <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
    <button class="fab" id="fab" aria-label="Log food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="tab" data-tab="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 0 1 6 0l-3 3"/></svg>Weight</button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   CONFIG — the only part you need to edit
   ============================================================ */
const CONFIG = {
  // Your Cloudflare Worker address (no slash at the end), e.g. "https://plato-api.yourname.workers.dev"
  WORKER_URL: "",
  // Donations: leave any of these as "" to hide them.
  GCASH_QR_IMAGE: "",   // upload your GCash QR next to index.html and write its file name, e.g. "gcash-qr.png"
  GCASH_NAME: "",       // name shown under the QR, e.g. "J. W. M."
  KOFI_URL: "",         // e.g. "https://ko-fi.com/yourname" (or a Buy Me a Coffee link)
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(Number(n)||0);
const r1 = n => Math.round((Number(n)||0)*10)/10;
function dstr(d=new Date()){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
function prettyDate(s){ const t=dstr(); if(s===t) return "Today"; if(s===addDays(t,-1)) return "Yesterday"; return new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }
function mealForNow(){ const h=new Date().getHours(); if(h<10) return "breakfast"; if(h<15) return "lunch"; if(h<17) return "snacks"; if(h<22) return "dinner"; return "snacks"; }
const MEALS = [["breakfast","Breakfast","var(--orange)"],["lunch","Lunch","var(--lime)"],["dinner","Dinner","var(--primary)"],["snacks","Snacks","var(--pink)"]];

/* ============ storage: this device only ============ */
// Everything lives in this browser's localStorage. Nothing is sent anywhere except
// food photos/descriptions to the AI (through your Worker) when you ask for an analysis.
const Store = {
  get(k,def){ try{ const v=localStorage.getItem("plato:"+k); return v? JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem("plato:"+k, JSON.stringify(v)); }catch(e){ toast("Storage is full — export a backup and clear old photos"); } },
  keys(){ return Object.keys(localStorage).filter(k=>k.startsWith("plato:")); }
};

/* ============ state ============ */
const S = {
  tab:"today", date:dstr(),
  profile:Store.get("profile",null), weights:Store.get("weights",[]), summary:Store.get("summary",{}), recents:Store.get("recents",[]),
  settings:Store.get("settings",{setupDone:false}), scans:Store.get("scans",null),
  day:null, setupStep:0, installEvt:null
};
function loadDay(){ S.day = Store.get("day-"+S.date,{entries:[],water:0}); if(!S.day.entries) S.day.entries=[]; }
function saveDay(){
  Store.set("day-"+S.date,S.day);
  const t=dayTotals(S.day);
  if(S.day.entries.length) S.summary[S.date]={kcal:r0(t.kcal),p:r0(t.p),c:r0(t.c),f:r0(t.f)}; else delete S.summary[S.date];
  Store.set("summary",S.summary);
}
function dayTotals(day){ const t={kcal:0,p:0,c:0,f:0,fiber:0,sugar:0,sodium:0}; for(const e of day.entries) for(const k in t) t[k]+=Number(e[k])||0; return t; }
function currentWeight(){ return S.weights.length? S.weights[S.weights.length-1].kg : (S.profile?.startKg||null); }
function saveSettings(){ Store.set("settings",S.settings); }
function deviceId(){ let id=Store.get("device",""); if(!id){ id=(crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid()).replace(/[^A-Za-z0-9-]/g,""); Store.set("device",id); } return id; }
function scansLeft(){ return S.scans&&S.scans.day===phDay()? S.scans.remaining : null; }
function phDay(){ return new Date(Date.now()+8*3600e3).toISOString().slice(0,10); }
const hasDonate=()=>!!(CONFIG.GCASH_QR_IMAGE||CONFIG.KOFI_URL);
function streak(){ let d=dstr(), n=0; if(!S.summary[d]) d=addDays(d,-1); while(S.summary[d]?.kcal>0){ n++; d=addDays(d,-1); } return n; }

/* ============ research-based plan ============ */
const ACTIVITY=[[1.2,"Sedentary","Desk job, little exercise"],[1.375,"Lightly active","Light exercise 1–3 days/week"],[1.55,"Moderately active","Exercise 3–5 days/week"],[1.725,"Very active","Hard exercise 6–7 days/week"]];
function calcPlan(){
  const p=S.profile, kg=currentWeight();
  if(!p||!kg||!p.heightCm||!p.age) return null;
  const m=p.heightCm/100;
  const bmr=10*kg+6.25*p.heightCm-5*p.age+(p.sex==="male"?5:-161);   // Mifflin–St Jeor
  const tdee=bmr*p.activity;
  const bmi=kg/(m*m), minHealthy=18.5*m*m, floor=p.sex==="male"?1500:1200;
  const goalOk=!p.goalKg||p.goalKg>=minHealthy-0.05;
  const losing=goalOk&&p.goalKg&&p.goalKg<kg-0.1;
  let pace=losing?Math.min(p.pace,kg*0.01):0;                          // max 1% body weight / week
  const capped=losing&&p.pace>kg*0.01;
  let deficit=pace*7700/7, target=tdee-deficit, floored=false;        // ~7,700 kcal per kg fat
  if(losing&&target<floor){ target=floor; floored=true; deficit=Math.max(0,tdee-floor); pace=deficit*7/7700; }
  target=Math.round(target/10)*10;
  const refKg=Math.min(kg,25*m*m);
  const proteinG=Math.round(1.6*refKg), fatG=Math.round(target*0.28/9);
  const carbG=Math.max(0,Math.round((target-proteinG*4-fatG*9)/4)), fiberG=Math.round(target/1000*14);
  const weeks=pace>0?(kg-p.goalKg)/pace:null, eta=weeks?addDays(dstr(),Math.round(weeks*7)):null;
  return {bmr,tdee,bmi,minHealthy,floor,goalOk,losing,pace,capped,deficit,target,floored,proteinG,fatG,carbG,fiberG,weeks,eta,kg};
}
function bmiLabel(b){ if(b<18.5) return "Underweight"; if(b<23) return "Healthy"; if(b<25) return "Overweight"; if(b<30) return "Obese I"; return "Obese II"; }

/* ============ AI (through your Cloudflare Worker) ============ */
async function fileToBase64Jpeg(file, max=1024){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej({code:"bad_image"}); i.src=URL.createObjectURL(file); });
  const sc=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas");
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL("image/jpeg",0.8).split(",")[1];
}
async function callWorker(payload, signal){
  let res;
  try{
    res=await fetch(CONFIG.WORKER_URL.replace(/\/$/,"")+"/analyze",{method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,deviceId:deviceId()})});
  }catch(e){ if(e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  let data={}; try{ data=await res.json(); }catch(e){}
  if(typeof data.remaining==="number"){ S.scans={day:phDay(),remaining:data.remaining,limit:data.limit}; Store.set("scans",S.scans); }
  if(!res.ok) throw {code:data.code||"busy"};
  return data;
}

/* ============ render shell ============ */
function render(){

function plateSVG(eaten,target){

    <circle cx="150" cy="150" r="146" fill="var(--surface2)"/>
    <circle cx="150" cy="150" r="133" fill="var(--surface)"/>
    <circle cx="150" cy="150" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"/>
    <circle cx="150" cy="150" r="${r}" fill="none" stroke="${over?"var(--red)":"url(#ring)"}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*frac} ${c}" transform="rotate(-90 150 150)"/>
  </svg>`;
}
function cheer(eaten,target){

  if(f>=0.5) return "You're on track ✨";
  return "Great start — keep logging 🙌";
}

/* ============ charts ============ */
function lineChart(points,goal){
  if(!points.length) return `<div class="empty">Log your weight to see the trend.</div>`;
  const W=340,H=190,pl=36,pr=10,pt=12,pb=26, vals=points.map(p=>p.kg).concat(goal?[goal]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals); if(hi-lo<2){lo-=1;hi+=1;} const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
  const t0=new Date(points[0].date).getTime(), t1=Math.max(new Date(points[points.length-1].date).getTime(),t0+864e5*6);
  const x=d=>pl+(new Date(d).getTime()-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=points.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+","+y(p.kg).toFixed(1)).join("");
  const area=path+`L${x(points[points.length-1].date).toFixed(1)},${H-pb}L${x(points[0].date).toFixed(1)},${H-pb}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    <defs><linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#6D28FF"/><stop offset="1" stop-color="#FF2E7E"/></linearGradient>
    <linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2E7E" stop-opacity=".25"/><stop offset="1" stop-color="#FF2E7E" stop-opacity="0"/></linearGradient></defs>
    ${[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(v)}</text>`).join("")}
    ${points.length>1?`<path d="${area}" fill="url(#wa)"/>`:""}
    ${goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="2"/><text x="${W-pr}" y="${y(goal)-5}" font-size="10" text-anchor="end" fill="var(--orange)" font-weight="700">goal ${goal}</text>`:""}
    <path d="${path}" fill="none" stroke="url(#wl)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3.5" fill="var(--surface)" stroke="var(--pink)" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${prettyDate(points[0].date)}</text>
    <text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${prettyDate(points[points.length-1].date)}</text></svg>`;
}
function barChart(days,target){
  const W=340,H=190,pl=36,pr=10,pt=12,pb=26, max=Math.max(target||0,...days.map(d=>d.kcal),500)*1.1, bw=(W-pl-pr)/days.length, y=v=>pt+(1-v/max)*(H-pt-pb);
  const lblEvery=days.length>14?5:1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2E7E"/><stop offset="1" stop-color="#6D28FF"/></linearGradient></defs>
    ${[.25,.5,.75].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(max*f)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${r0(max*f/10)*10}</text>`).join("")}
    ${days.map((d,i)=>{ const over=target&&d.kcal>target*1.05; return `${d.kcal?`<rect x="${pl+i*bw+bw*.16}" y="${y(d.kcal)}" width="${bw*.68}" height="${Math.max(0,H-pb-y(d.kcal))}" rx="3" fill="${over?"var(--red)":"url(#bg1)"}"/>`:""}
      ${i%lblEvery===0?`<text x="${pl+i*bw+bw/2}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)">${days.length>14?new Date(d.date+"T12:00:00").getDate():new Date(d.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"narrow"})}</text>`:""}`;}).join("")}
    ${target?`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="2"/><text x="${W-pr}" y="${y(target)-5}" font-size="10" text-anchor="end" fill="var(--orange)" font-weight="700">target</text>`:""}</svg>`;
}
function trendPerWeek(){
  const pts=S.weights.filter(w=>w.date>=addDays(dstr(),-28)); if(pts.length<3) return null;
  const xs=pts.map(p=>new Date(p.date).getTime()/864e5), ys=pts.map(p=>p.kg), mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let n=0,d=0; xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my); d+=(x-mx)**2;}); return d?n/d*7:null;
}

/* ============ Progress ============ */
function viewProgress(){
  const plan=calcPlan(), target=plan?.target||0, range=S.progRange||14, days=[];

  const logged=days.filter(d=>d.kcal>0), avg=logged.length?logged.reduce((a,d)=>a+d.kcal,0)/logged.length:0;
  const onTarget=logged.filter(d=>target&&d.kcal<=target*1.05).length, start=S.weights[0]?.kg, now=currentWeight(), trend=trendPerWeek();
  const ds=logged.map(d=>S.summary[d.date]); let split=null;
  if(ds.length){ const s=ds.reduce((a,d)=>({p:a.p+d.p,c:a.c+d.c,f:a.f+d.f}),{p:0,c:0,f:0}); const kc=s.p*4+s.c*4+s.f*9||1; split={p:s.p*4/kc*100,c:s.c*4/kc*100,f:s.f*9/kc*100}; }
  return `

  <h2>Weight</h2>

    <p class="muted small" style="margin:0">Plato is free with no ads. Each photo scan costs a small amount of AI credit, so any amount helps keep it running for everyone. Salamat! 💜</p>
    ${CONFIG.GCASH_QR_IMAGE?`<div><img src="${esc(CONFIG.GCASH_QR_IMAGE)}" alt="GCash QR code for donations" style="width:220px;max-width:100%;border-radius:16px;background:#fff;padding:8px">
      <div style="font-weight:800;margin-top:4px">GCash${CONFIG.GCASH_NAME?` · ${esc(CONFIG.GCASH_NAME)}`:""}</div><div class="muted small">Screenshot this QR, then open GCash → Pay QR → Upload QR.</div></div>`:""}
    ${CONFIG.KOFI_URL?`<a class="btn" href="${esc(CONFIG.KOFI_URL)}" target="_blank" rel="noopener" style="display:block;text-decoration:none">Donate online ☕</a>`:""}
  </div>`:""}

  <h2>Photo scans</h2>
  <div class="card stack">
    <p class="muted small" style="margin:0">${!CONFIG.WORKER_URL?"Photo scanning isn't turned on yet.":scansLeft()!==null?`You have <b style="color:var(--ink)">${scansLeft()} of ${S.scans.limit}</b> photo scans left today. They reset at midnight.`:"You get a set number of free photo scans each day. They reset at midnight."}</p>
    <p class="muted small" style="margin:0"><b style="color:var(--ink)">Privacy:</b> when you scan, your photo and note are sent to Google's Gemini AI to estimate nutrition, under Google's Gemini API terms. Avoid including faces or personal info in food photos. Plato itself doesn't store your photos, and your food log never leaves this phone.</p>
  </div>

  <h2>Install and backup</h2>
  <div class="card stack">
    ${standalone?`<div class="note good">✅ Plato is installed on this device.</div>`
      : S.installEvt?`<button class="btn" id="install">Install Plato on this device</button>`
      : `<div class="note">${isIOS?"To install: tap the Share button in Safari, then “Add to Home Screen”.":"To install: open your browser menu and choose “Install app” or “Add to Home screen”."}</div>`}
    <p class="muted small" style="margin:0">Your log lives only in this browser. Export a backup now and then — if you clear browser data or change phones, you can import it back.</p>
    <div class="row"><button class="btn ghost" id="exp">Export backup</button><label class="btn ghost" style="text-align:center;cursor:pointer">Import backup<input type="file" accept="application/json,.json" id="imp" class="hidden"></label></div>
    <button class="btn danger" id="wipe">Erase all my data on this device</button>
  </div>

  <h2>How it's calculated</h2>
  <div class="card method">
    <p><b>BMR</b> uses the Mifflin–St Jeor equation, the most accurate formula for adults in validation studies and the one recommended by the Academy of Nutrition and Dietetics.</p>
    <p><b>Maintenance (TDEE)</b> = BMR × an activity factor (1.2 to 1.725).</p>
    <p><b>Deficit</b> uses ≈7,700 kcal per kg of body fat. Pace is capped at 1% of body weight per week, and the target never drops below 1,200 kcal (women) or 1,500 kcal (men).</p>
    <p><b>Macros</b>: protein at 1.6 g/kg (adjusted weight above BMI 25) to protect muscle; fat at 28% of calories; carbs fill the rest. Fiber at 14 g per 1,000 kcal. Sodium limit is the WHO's 2,000 mg.</p>
    <p><b>BMI</b> uses the WHO Asian cut-offs (overweight from 23), which fit Filipino adults better.</p>
    <p>These are estimates. If your weight doesn't move after 3–4 weeks of consistent logging, lower the target by 100–200 kcal. This isn't medical advice — check with a doctor if you're pregnant, breastfeeding, diabetic or on medication.</p>
  </div>`;
}

/* ============ binding ============ */
function bindView(){
  const app=$("#app");
  app.querySelectorAll("[data-setup]").forEach(b=>b.onclick=()=>{ S.settings.setupDone=true; saveSettings(); S.tab="me"; render(); });
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ S.date=addDays(S.date,+b.dataset.day); if(S.date>dstr()) S.date=dstr(); loadDay(); render(); });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.go; render(); });
  app.querySelectorAll("[data-glass]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.glass; S.day.water=S.day.water===i+1?i:i+1; saveDay(); render(); });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const e=S.day.entries.find(x=>x.id===b.dataset.del); if(!confirm(`Delete ${e?.name||"this entry"}?`)) return; S.day.entries=S.day.entries.filter(x=>x.id!==b.dataset.del); saveDay(); render(); });
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openLogSheet(b.dataset.add));
  app.querySelectorAll("[data-recent]").forEach(b=>b.onclick=()=>{ const r=S.recents[+b.dataset.recent]; S.day.entries.push({...r,id:uid(),meal:mealForNow(),time:Date.now()}); saveDay(); toast(`Added ${r.name}`); render(); });
  app.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{ S.progRange=+b.dataset.range; render(); });
  app.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{ S.weights=S.weights.filter(w=>w.date!==b.dataset.wdel); Store.set("weights",S.weights); render(); });
  const ws=$("#wSave"); if(ws) ws.onclick=()=>{ const v=parseFloat($("#wIn").value); if(!(v>=25&&v<=350)) return toast("Enter a weight between 25 and 350 kg"); logWeight(v); toast("Weight saved"); render(); };

  app.querySelectorAll("[data-donate]").forEach(b=>b.onclick=()=>{ Store.set("nudged",true); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
  app.querySelectorAll("[data-nudge-x]").forEach(b=>b.onclick=()=>{ Store.set("nudged",true); render(); });

  // plan form
  const tmp={...(S.profile||{sex:"female",activity:1.375,pace:0.5})};
  app.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{ tmp.sex=b.dataset.sex; app.querySelectorAll("[data-sex]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  app.querySelectorAll("[data-pace]").forEach(b=>b.onclick=()=>{ tmp.pace=+b.dataset.pace; app.querySelectorAll("[data-pace]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const ps=$("#pSave"); if(ps) ps.onclick=()=>{
    const age=+$("#pAge").value, h=+$("#pH").value, w=+$("#pW").value, g=+$("#pG").value;
    if(!(age>=18&&age<=100)) return toast("This calculator is for adults 18 and over");
    if(!(h>=120&&h<=230)) return toast("Enter your height in cm (120–230)");
    if(!(w>=25&&w<=350)) return toast("Enter your current weight in kg");
    if(g&&!(g>=25&&g<=350)) return toast("Enter a goal weight in kg");
    S.profile={...tmp,age,heightCm:h,goalKg:g||w,activity:+$("#pAct").value,startKg:S.profile?.startKg||w};
    if(currentWeight()!==w) logWeight(w);
    Store.set("profile",S.profile); toast("Plan saved 🎯"); render();
  };

  // install / backup
  const ins=$("#install"); if(ins) ins.onclick=async()=>{ S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt=null; render(); };
  const ex=$("#exp"); if(ex) ex.onclick=()=>{
    const data={app:"plato",version:1,exported:new Date().toISOString(),data:{}};
    for(const k of Store.keys()){ if(["plato:settings","plato:device","plato:scans"].includes(k)) continue; data.data[k]=localStorage.getItem(k); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"})); a.download=`plato-backup-${dstr()}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast("Backup downloaded");
  };
  const im=$("#imp"); if(im) im.onchange=async()=>{
    const f=im.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(d.app!=="plato"||!d.data) throw 0;
      if(!confirm("Replace the data on this device with this backup?")) return;
      for(const k of Store.keys()) if(!["plato:settings","plato:device","plato:scans"].includes(k)) localStorage.removeItem(k);
      for(const [k,v] of Object.entries(d.data)) if(k.startsWith("plato:")&&!["plato:settings","plato:device","plato:scans"].includes(k)) localStorage.setItem(k,v);
      location.reload();
    }catch(e){ toast("That file isn't a Plato backup"); }
  };
  const wp=$("#wipe"); if(wp) wp.onclick=()=>{ if(!confirm("Erase your plan, food log and weights from this device? This can't be undone.")) return; for(const k of Store.keys()) if(k!=="plato:device") localStorage.removeItem(k); location.reload(); };
}
function logWeight(v){ const d=dstr(); S.weights=S.weights.filter(x=>x.date!==d).concat({date:d,kg:r1(v)}).sort((a,b)=>a.date<b.date?-1:1); Store.set("weights",S.weights); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; if(S.tab==="today"){ S.date=S.date; } render(); });
$("#fab").onclick=()=>openLogSheet(mealForNow());

/* ============ log sheet ============ */
let L=null;
function openSheet(){ $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); }
function closeSheet(){ L?.ctl?.abort(); L=null; $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&L) closeSheet(); });
function openLogSheet(meal){ L={meal,step:"pick",file:null,url:null,note:"",items:[],notes:"",mode:"photo"}; openSheet(); drawSheet(); }
function sheetHead(title){ return `<div class="grab"></div><div class="sheet-head"><h3 id="sheetTitle">${title}</h3><button class="iconbtn" data-close aria-label="Close">✕</button></div>`; }
function mealSelect(){ return `<select class="inp" id="lMeal" aria-label="Meal">${MEALS.map(([k,l])=>`<option value="${k}" ${L.meal===k?"selected":""}>${l}</option>`).join("")}</select>`; }

function drawSheet(){
  const b=$("#sheetBody"); if(!L) return;
  const aiOn=!!CONFIG.WORKER_URL, online=navigator.onLine, left=scansLeft(), outOfScans=left===0;
  if(L.step==="pick"){
    b.innerHTML=sheetHead("Log food")+`
      ${!aiOn?`<div class="note">${errText({code:"off"})}</div>`
        :outOfScans?`<div class="note">${errText({code:"limit"})}${hasDonate()?` <a href="#" data-donate-link>Support Plato</a> to help keep scans free.`:""}</div>`
        :!online?`<div class="note">You're offline. Photo analysis needs internet — use quick add or recent foods for now.</div>`
        :`<div class="pick">
          <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo<input type="file" accept="image/*" capture="environment" data-file></label>
          <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>From gallery<input type="file" accept="image/*" data-file></label>
        </div>
        ${left!==null?`<p class="muted small" style="text-align:center;margin:8px 0 0">${left} photo scan${left===1?"":"s"} left today</p>`:""}
        <h2 style="margin-top:18px">Or describe it</h2>
        <textarea class="inp" id="lDesc" rows="2" placeholder="e.g. 1 cup rice, 2 pcs chicken adobo, 1 banana"></textarea>
        <button class="btn ghost" id="lDescGo" style="margin-top:8px">Estimate from description</button>`}
      <h2>Quick add</h2>
      <div class="stack">
        <input class="inp" id="qName" placeholder="Food name">
        <div class="row"><input class="inp" id="qK" type="number" inputmode="numeric" placeholder="kcal"><input class="inp" id="qP" type="number" inputmode="decimal" placeholder="Protein g"></div>
        <div class="row"><input class="inp" id="qC" type="number" inputmode="decimal" placeholder="Carbs g"><input class="inp" id="qF" type="number" inputmode="decimal" placeholder="Fat g"></div>
        ${mealSelect()}
        <button class="btn" id="qGo">Add</button>
      </div>`;
    b.querySelectorAll("[data-donate-link]").forEach(x=>x.onclick=e=>{ e.preventDefault(); closeSheet(); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
    b.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; L.file=f; L.url=URL.createObjectURL(f); L.step="confirm"; drawSheet(); });
    const dg=$("#lDescGo"); if(dg) dg.onclick=()=>{ const t=$("#lDesc").value.trim(); if(!t) return toast("Describe what you ate first"); L.note=t; L.mode="text"; L.meal=$("#lMeal").value; analyze(); };
    $("#qGo").onclick=()=>{ const name=$("#qName").value.trim()||"Quick add", k=+$("#qK").value; if(!(k>0)) return toast("Enter the calories"); L.meal=$("#lMeal").value;
      commitEntry({name,kcal:k,p:+$("#qP").value||0,c:+$("#qC").value||0,f:+$("#qF").value||0,fiber:0,sugar:0,sodium:0,thumb:null}); };
  }
  else if(L.step==="confirm"){
    b.innerHTML=sheetHead("Analyze photo")+`<img class="preview" src="${L.url}" alt="Your food photo">
      <label class="f" for="lNote" style="margin-top:12px">Anything the photo can't show? (optional)</label>
      <input class="inp" id="lNote" placeholder="e.g. fried in butter, 1.5 cups rice, no sauce" value="${esc(L.note)}">
      <div style="margin-top:10px">${mealSelect()}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Retake</button><button class="btn" id="lGo">Analyze ✨</button></div>`;
    $("#lGo").onclick=()=>{ L.note=$("#lNote").value.trim(); L.meal=$("#lMeal").value; L.mode="photo"; analyze(); };
  }
  else if(L.step==="loading"){
    b.innerHTML=sheetHead("Analyzing")+`${L.url&&L.mode==="photo"?`<img class="preview" src="${L.url}" alt="">`:""}<div class="spinner"></div><p class="muted" style="text-align:center">Identifying foods and estimating portions. This takes about 5–15 seconds.</p><button class="btn ghost" data-stop>Stop</button>`;
    b.querySelector("[data-stop]").onclick=()=>{ L.ctl?.abort(); L.step=L.mode==="photo"?"confirm":"pick"; drawSheet(); };
  }
  else if(L.step==="error"){
    b.innerHTML=sheetHead("Couldn't analyze")+`<div class="note warn">${esc(L.err)}</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Back</button>${L.retry?`<button class="btn" id="lRetry">Try again</button>`:""}</div>
      ${["limit","capacity","credits","quota"].includes(L.errCode)&&hasDonate()?`<button class="btn" data-donate-link style="margin-top:10px">Support Plato ☕</button>`:""}`;
    b.querySelectorAll("[data-donate-link]").forEach(x=>x.onclick=e=>{ e.preventDefault(); closeSheet(); S.tab="me"; render(); setTimeout(()=>$("#support")?.scrollIntoView(),50); });
    const rt=$("#lRetry"); if(rt) rt.onclick=()=>analyze();
  }
  else if(L.step==="review"){
    const tot=itemTotals();
    b.innerHTML=sheetHead("Check and save")+`
      ${L.url&&L.mode==="photo"?`<img class="preview" src="${L.url}" alt="" style="max-height:160px">`:""}
      ${L.items.length?"":`<div class="note warn" style="margin-top:10px">No food found. ${esc(L.notes)}</div>`}
      ${L.items.map((it,i)=>`<div class="item">
        <div class="item-top"><input value="${esc(it.name)}" data-iname="${i}" aria-label="Food name"><button class="iconbtn" data-irm="${i}" aria-label="Remove ${esc(it.name)}">✕</button></div>
        <div class="muted small">${esc(it.portion||"")}${it.grams?` · ~${r0(it.grams*it.mult)} g`:""}</div>
        <div class="item-meta">
          <div class="portion"><button data-im="${i}" data-d="-1" aria-label="Smaller portion">−</button><span>×${it.mult}</span><button data-im="${i}" data-d="1" aria-label="Bigger portion">+</button></div>
          <div><b>${r0(it.kcal*it.mult)}</b> kcal <span class="muted small">P ${r0(it.protein_g*it.mult)} · C ${r0(it.carbs_g*it.mult)} · F ${r0(it.fat_g*it.mult)}</span></div>
        </div></div>`).join("")}
      ${L.notes&&L.items.length?`<p class="muted small" style="margin:10px 2px 0">${esc(L.notes)}${L.confidence?` (confidence: ${esc(L.confidence)})`:""}</p>`:""}
      <div class="totals"><div><span class="muted">Total</span><br><b>${r0(tot.kcal)} kcal</b></div><div style="text-align:right">P ${r0(tot.p)} · C ${r0(tot.c)} · F ${r0(tot.f)} g<br><span class="muted">Fiber ${r0(tot.fiber)} g · Sodium ${r0(tot.sodium)} mg</span></div></div>
      <div style="margin-top:10px">${mealSelect()}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-back>Start over</button><button class="btn" id="lSave" ${L.items.length?"":"disabled"}>Save to log</button></div>`;
    b.querySelectorAll("[data-iname]").forEach(inp=>inp.oninput=()=>{ L.items[+inp.dataset.iname].name=inp.value; });
    b.querySelectorAll("[data-irm]").forEach(x=>x.onclick=()=>{ L.items.splice(+x.dataset.irm,1); drawSheet(); });
    const steps=[0.25,0.5,0.75,1,1.25,1.5,2,2.5,3];
    b.querySelectorAll("[data-im]").forEach(x=>x.onclick=()=>{ const it=L.items[+x.dataset.im]; let k=steps.indexOf(it.mult); k=Math.max(0,Math.min(steps.length-1,k+ +x.dataset.d)); it.mult=steps[k]; drawSheet(); });
    $("#lMeal").onchange=e=>L.meal=e.target.value;
    $("#lSave").onclick=async()=>{ L.meal=$("#lMeal").value; const t=itemTotals(), name=L.items.map(i=>i.name).join(", "), thumb=L.file?await makeThumb(L.file):null;
      commitEntry({name,kcal:t.kcal,p:t.p,c:t.c,f:t.f,fiber:t.fiber,sugar:t.sugar,sodium:t.sodium,thumb}); };
  }
  b.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
  b.querySelectorAll("[data-back]").forEach(x=>x.onclick=()=>{ L.items=[]; L.step="pick"; L.file=null; L.url=null; drawSheet(); });
}
function itemTotals(){ const t={kcal:0,p:0,c:0,f:0,fiber:0,sugar:0,sodium:0}; for(const it of L.items){ t.kcal+=it.kcal*it.mult; t.p+=it.protein_g*it.mult; t.c+=it.carbs_g*it.mult; t.f+=it.fat_g*it.mult; t.fiber+=it.fiber_g*it.mult; t.sugar+=it.sugar_g*it.mult; t.sodium+=it.sodium_mg*it.mult; } return t; }
function commitEntry(e){
  const entry={id:uid(),meal:L.meal,time:Date.now(),...e,kcal:r0(e.kcal),p:r1(e.p),c:r1(e.c),f:r1(e.f),fiber:r1(e.fiber),sugar:r1(e.sugar),sodium:r0(e.sodium)};
  S.day.entries.push(entry); saveDay(); Store.set("logCount",Store.get("logCount",0)+1);
  const {id,meal,time,thumb,...rest}=entry;
  S.recents=[rest,...S.recents.filter(r=>r.name.toLowerCase()!==rest.name.toLowerCase())].slice(0,15); Store.set("recents",S.recents);
  closeSheet(); toast(`Logged ${r0(entry.kcal)} kcal ✅`); S.tab="today"; render();
}
async function makeThumb(file){
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const s=120,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const m=Math.min(img.width,img.height);
    cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s); return cv.toDataURL("image/jpeg",0.55);
  }catch(e){ return null; }
}

async function analyze(){
  if(!CONFIG.WORKER_URL){ L.err=errText({code:"off"}); L.errCode="off"; L.retry=false; L.step="error"; return drawSheet(); }
  L.step="loading"; drawSheet(); L.ctl=new AbortController();
  try{
    const image=L.mode==="photo"?await fileToBase64Jpeg(L.file):undefined;
    const res=await callWorker({mode:L.mode,note:L.note,image},L.ctl.signal);
    if(!L) return;
    const num=v=>Math.max(0,Number(v)||0);
    L.items=(Array.isArray(res.items)?res.items:[]).map(it=>({name:String(it.name||"Food").slice(0,80),portion:String(it.portion||"").slice(0,80),grams:num(it.grams),kcal:num(it.kcal),protein_g:num(it.protein_g),carbs_g:num(it.carbs_g),fat_g:num(it.fat_g),fiber_g:num(it.fiber_g),sugar_g:num(it.sugar_g),sodium_mg:num(it.sodium_mg),mult:1}));
    L.notes=String(res.notes||""); L.confidence=String(res.confidence||""); L.step="review"; drawSheet();
  }catch(e){
    if(!L||e?.code==="cancelled") return;
    L.err=errText(e); L.errCode=e?.code;
    L.retry=!["config","forbidden","off","limit","capacity","credits","quota"].includes(e?.code); L.step="error"; drawSheet();
  }
}

/* ============ boot ============ */
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); S.installEvt=e; if(S.tab==="me") render(); });
window.addEventListener("online",()=>{ if(!L) render(); });
window.addEventListener("offline",()=>{ if(!L) render(); });
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
// If the app was left open overnight, jump to the new day when it's reopened
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.date<dstr() && S._lastToday===S.date){ S.date=dstr(); loadDay(); render(); } S._lastToday=dstr(); });
S._lastToday=dstr();
if(S.settings.apiKey!==undefined||S.settings.model!==undefined){ delete S.settings.apiKey; delete S.settings.model; saveSettings(); }
loadDay();
if(S.settings.setupDone&&!S.profile) S.tab="me";
render();
</script>
</body>
</html>
